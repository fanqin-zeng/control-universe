<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="t d"><title id="t">鲁棒性能的增广反馈</title><desc id="d">M输出物理信号经Delta返回，性能输出z经满块Delta p返回w。两个反馈同时检验。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="760" height="360" rx="12" fill="#f1f5f9"/><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M445 130H510V65H145V130H250"/><path d="M445 230H620V310H145V230H250"/><path d="M445 130H510"/><path d="M145 230H250"/></g><g fill="#fff" stroke="#2563eb" stroke-width="2"><rect x="250" y="100" width="195" height="170" rx="8"/><rect x="280" y="38" width="145" height="54" rx="6"/><rect x="265" y="283" width="245" height="54" rx="6"/></g><g font-family="sans-serif" fill="#0f172a" text-anchor="middle"><text x="347" y="175" font-size="27">M(s)</text><text x="347" y="206" font-size="17">已固定控制器的已知部分</text><text x="352" y="72" font-size="22">物理块 Δ</text><text x="386" y="316" font-size="21">性能满块 Δp：z → w</text><text x="208" y="119" font-size="17">vΔ</text><text x="480" y="119" font-size="17">zΔ</text><text x="201" y="220" font-size="18">w</text><text x="480" y="220" font-size="18">z</text><text x="640" y="175" font-size="17">正反馈用于</text><text x="640" y="200" font-size="17">检验增益门槛</text></g></svg>