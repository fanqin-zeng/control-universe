<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
 <title id="title">上LFT端口约定</title><desc id="desc">输入按v和u分组，输出按z和y分组。反馈块Delta从z得到v，闭环关系v等于Delta乘z。</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
 <rect width="800" height="380" rx="14" fill="#f8fafc"/>
 <g fill="white" stroke="#334155" stroke-width="2"><rect x="280" y="150" width="240" height="160" rx="8"/><rect x="325" y="30" width="150" height="65" rx="8"/></g>
 <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M520 195H640V62H475"/><path d="M325 62H160V195H280"/><path d="M55 270H280"/><path d="M520 270H745"/></g>
 <g font-family="sans-serif" fill="#0f172a" text-anchor="middle"><text x="400" y="72" font-size="26">Δ</text><text x="400" y="211" font-size="25">P₁₁　P₁₂</text><text x="400" y="278" font-size="25">P₂₁　P₂₂</text><text x="225" y="182" font-size="24">v</text><text x="575" y="182" font-size="24">z</text><text x="100" y="255" font-size="24">u</text><text x="700" y="255" font-size="24">y</text><text x="400" y="350" font-size="21">[z; y] = P [v; u]　　v = Δ z</text><text x="400" y="126" font-size="19">不确定性反馈</text></g>
</svg>
