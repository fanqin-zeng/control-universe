<svg xmlns="http://www.w3.org/2000/svg" width="800" height="345" viewBox="0 0 800 345" role="img" aria-labelledby="title desc"><title id="title">零极点位置示意</title><desc id="desc">共轭复极点位于实轴上下对称位置；实极点在实轴上；空心圆表示零点。图仅示意位置，不对应下方交互模型的参数。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs><rect width="800" height="345" rx="12" fill="#fff"/><g font-family="system-ui, Microsoft YaHei, sans-serif"><text x="400" y="32" text-anchor="middle" font-size="21" fill="#0f172a">零极点位置示意</text><path d="M 100 175 H 720" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 520 285 V 55" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="748" y="182" text-anchor="middle" font-size="19" fill="#0f172a">Re(s)</text><text x="520" y="49" text-anchor="middle" font-size="16" fill="#0f172a">Im(s)</text><text x="537" y="196" text-anchor="middle" font-size="15" fill="#0f172a">0</text><text x="220" y="183" text-anchor="middle" font-size="29" fill="#0f172a">×</text><text x="370" y="110" text-anchor="middle" font-size="29" fill="#0f172a">×</text><text x="370" y="255" text-anchor="middle" font-size="29" fill="#0f172a">×</text><circle cx="290" cy="175" r="8" fill="white" stroke="#2563eb" stroke-width="2.5"/><text x="205" y="219" text-anchor="middle" font-size="17" fill="#0f172a">实极点</text><text x="275" y="151" text-anchor="middle" font-size="17" fill="#0f172a">零点</text><text x="260" y="80" text-anchor="middle" font-size="17" fill="#0f172a">共轭复极点（上下对称）</text><text x="400" y="320" text-anchor="middle" font-size="16" fill="#0f172a">定性示意；不对应下方交互模型的具体参数</text></g></svg>