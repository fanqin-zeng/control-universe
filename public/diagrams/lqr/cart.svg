<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title"><title id="title">归一化小车的位置、速度和加速度分别计价，权重生成反馈后仍需核验实际限幅</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="760" height="300" rx="12" fill="#f8fafc"/><g fill="none" stroke="#475569" stroke-width="2"><rect x="80" y="90" width="145" height="65" rx="8"/><circle cx="110" cy="169" r="13"/><circle cx="195" cy="169" r="13"/><path d="M40 184H280M225 120H285" marker-end="url(#a)"/><rect x="335" y="70" width="360" height="130" rx="6"/><path d="M285 120H335" marker-end="url(#a)"/></g><g font-family="sans-serif" font-size="21" fill="#1e293b" text-anchor="middle"><text x="152" y="130">归一化小车</text><text x="155" y="65">位置 x₁、速度 x₂</text><text x="515" y="105">Q：位置与速度偏差</text><text x="515" y="140">R：加速度输入 u</text><text x="515" y="175">Riccati → K → u=−Kx</text><text x="380" y="255">先按允许尺度归一化，再核对轨迹、输入与实际限幅</text></g></svg>
