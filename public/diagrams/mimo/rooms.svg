<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc"><title id="title">相邻房间的供暖耦合</title><desc id="desc">两个加热器各有直接供暖通道，房间之间的传热让另一侧温度也发生变化。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#b45309"/></marker></defs><rect width="720" height="360" rx="12" fill="#f8fafc"/><g fill="#fff" stroke="#64748b" stroke-width="2"><rect x="40" y="40" width="300" height="210" rx="8"/><rect x="380" y="40" width="300" height="210" rx="8"/></g><g font-family="sans-serif" text-anchor="middle" fill="#0f172a" font-size="22"><text x="190" y="80">房间一 · 温度 y₁</text><text x="530" y="80">房间二 · 温度 y₂</text><text x="190" y="207">加热功率 u₁</text><text x="530" y="207">加热功率 u₂</text><text x="360" y="296">本房加热，也会经墙体影响邻房</text><text x="360" y="331" font-size="18">生活直觉；后文数值采用独立的归一化教学模型</text></g><g fill="#fff7ed" stroke="#b45309" stroke-width="2"><rect x="135" y="135" width="110" height="40" rx="5"/><rect x="475" y="135" width="110" height="40" rx="5"/></g><g stroke="#b45309" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M190 135 V96"/><path d="M530 135 V96"/><path d="M270 113 H450" marker-start="url(#arrow)"/></g><text x="360" y="101" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#92400e">传热耦合</text></svg>