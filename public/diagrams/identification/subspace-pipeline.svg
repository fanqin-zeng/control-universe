<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" role="img" aria-labelledby="title desc"><title id="title">子空间辨识两条教学路线</title><desc id="desc">脉冲记录构造Hankel和错位块得到ERA；一般输入输出记录先做未来输入QR消去，提取可观子空间再移位与回归；两者都用独立记录验证。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#334155"/></marker></defs><rect width="940" height="300" rx="12" fill="#f8fafc"/><g fill="white" stroke="#64748b" stroke-width="2"><rect x="20" y="35" width="150" height="70" rx="8"/><rect x="210" y="35" width="200" height="70" rx="8"/><rect x="450" y="35" width="180" height="70" rx="8"/><rect x="20" y="155" width="150" height="95" rx="8"/><rect x="210" y="155" width="200" height="95" rx="8"/><rect x="450" y="155" width="180" height="95" rx="8"/><rect x="710" y="85" width="200" height="115" rx="8"/></g><g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M170 70H210"/><path d="M410 70H450"/><path d="M170 202H210"/><path d="M410 202H450"/><path d="M630 70H675V120H710"/><path d="M630 202H675V170H710"/></g><g font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a"><text x="95" y="64">脉冲响应</text><text x="95" y="91">h₀ … h₈</text><text x="310" y="63">H₀ / 错位 H₁</text><text x="310" y="91">SVD 低秩因子</text><text x="540" y="64">ERA 实现</text><text x="540" y="91">A、B、C、D</text><text x="95" y="191">一般输入输出</text><text x="95" y="224">u、y 时间记录</text><text x="310" y="185">未来输入 QR 消去</text><text x="310" y="213">提取可观子空间</text><text x="310" y="239">不是原始 Y 直接降秩</text><text x="540" y="186">移位求 A、C</text><text x="540" y="215">回归 B、D、x₀</text><text x="810" y="119">未参与拟合的记录</text><text x="810" y="151">预测 / 残差 / 极点</text><text x="810" y="182">检查阶次与假设</text></g><text x="20" y="282" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#334155">相似状态坐标不等于物理状态；噪声、激励和有限窗口决定哪些方向可识别。</text></svg>
