<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" role="img" aria-labelledby="title desc">
<title id="title">系统辨识的迭代流程</title><desc id="desc">目的指导实验，数据进入模型估计，再用独立数据验证；信息不足或模型不合适时返回设计。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
<rect width="720" height="290" rx="12" fill="#f8fafc"/>
<g fill="#e0f2fe" stroke="#0369a1" stroke-width="2"><rect x="20" y="45" width="145" height="90" rx="8"/><rect x="195" y="45" width="145" height="90" rx="8"/><rect x="370" y="45" width="145" height="90" rx="8"/><rect x="545" y="45" width="155" height="90" rx="8"/></g>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#0f172a" font-size="18"><text x="92" y="78">目的与实验</text><text x="92" y="110" font-size="14">输入、单位、采样</text><text x="267" y="78">输入输出数据</text><text x="267" y="110" font-size="14">分开估计与验证</text><text x="442" y="78">模型与估计</text><text x="442" y="110" font-size="14">结构、参数、准则</text><text x="622" y="78">独立验证</text><text x="622" y="110" font-size="14">预测、仿真、残差</text><text x="360" y="245" font-size="16">信息不足返回实验；结构不合适返回模型设计</text></g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M165 90H191"/><path d="M340 90H366"/><path d="M515 90H541"/><path d="M622 135V195H92V140"/><path d="M442 195V140"/></g>
</svg>
