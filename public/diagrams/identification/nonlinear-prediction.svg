<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc"><title id="title">一步预测与自由滚动的数据接口</title><desc id="desc">上路每拍接收真实历史输出，给出一步预测。下路只接收初值并把自己的预测延迟后反馈。两路使用固定已拟合模型和同一已知输入；验证测试不回流训练。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L8 3.5L0 7Z" fill="#334155"/></marker></defs><rect width="960" height="330" rx="12" fill="#f8fafc"/><g fill="white" stroke="#64748b" stroke-width="2"><rect x="25" y="35" width="200" height="65" rx="8"/><rect x="330" y="35" width="210" height="65" rx="8"/><rect x="650" y="35" width="270" height="65" rx="8"/><rect x="25" y="165" width="200" height="65" rx="8"/><rect x="330" y="165" width="210" height="65" rx="8"/><rect x="650" y="165" width="270" height="65" rx="8"/><rect x="370" y="265" width="130" height="40" rx="8"/></g><g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M225 68H330"/><path d="M540 68H650"/><path d="M225 198H330"/><path d="M540 198H650"/><path d="M785 230V285H500"/><path d="M370 285H285V218H330"/></g><g font-family="Arial,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a"><text x="125" y="62">每拍真实历史 yₖ</text><text x="125" y="88">已知输入 uₖ</text><text x="435" y="62">固定模型 Fθ</text><text x="435" y="88">不在预测时重训练</text><text x="785" y="62">一步预测 ŷₖ₊₁|ₖ</text><text x="785" y="88">下一拍仍看真实历史</text><text x="125" y="191">只给初值 y₀</text><text x="125" y="218">已知输入 uₖ</text><text x="435" y="191">同一个 Fθ</text><text x="435" y="218">接收自身预测历史</text><text x="785" y="191">自由滚动 ỹₖ₊₁</text><text x="785" y="218">后续真实输出只评分</text><text x="435" y="292">延迟一拍</text></g><text x="25" y="320" font-family="Arial,Microsoft YaHei,sans-serif" font-size="17" fill="#334155">训练拟合参数 → 验证选择模型 → 独立测试报告；测试结果不回流参数或选择。</text></svg>
