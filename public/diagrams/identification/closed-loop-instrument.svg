<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" role="img" aria-labelledby="title desc"><title id="title">严格因果闭环与外部工具</title><desc id="desc">独立注入r与负反馈f乘过去输出组成u，经一拍延迟对象后与输出扰动v相加形成y。r另供工具z，扰动可经反馈影响后续输入。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><rect width="820" height="380" rx="12" fill="#f1f5f9"/><g fill="white" stroke="#64748b" stroke-width="2"><circle cx="190" cy="115" r="21"/><rect x="315" y="82" width="175" height="66" rx="6"/><circle cx="600" cy="115" r="21"/><rect x="365" y="218" width="95" height="48" rx="6"/><rect x="45" y="274" width="260" height="48" rx="6"/></g><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M55 115h111M212 115h100M492 115h84M622 115h138M600 45v46M710 115v127H463M363 242H190V139M100 115v156"/></g><g font-family="sans-serif" font-size="18" fill="#0f172a" text-anchor="middle"><text x="100" y="92">r[k]</text><text x="190" y="121">+</text><text x="173" y="153">−</text><text x="265" y="96">u[k]</text><text x="402" y="110">对象 b 与一拍延迟</text><text x="402" y="135">y[k]=b u[k−1]+v[k]</text><text x="600" y="121">+</text><text x="600" y="32">v[k]</text><text x="733" y="94">y[k]</text><text x="413" y="248">f</text><text x="175" y="304">移位工具 z[k]=r[k−1]</text><text x="410" y="355">过去输出经反馈影响输入；新创新w[k]尚未进入u[k−1]</text></g></svg>
