<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" role="img" aria-labelledby="title desc"><title id="title">动态辨识的数据配对</title><desc id="desc">当前读数和当前输入形成回归向量，下一次读数形成目标；同一行送入批量或递推最小二乘。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#334155"/></marker></defs><rect width="720" height="250" rx="12" fill="#f8fafc"/><g fill="#e0f2fe" stroke="#0369a1" stroke-width="2"><rect x="20" y="35" width="190" height="75" rx="8"/><rect x="280" y="35" width="190" height="75" rx="8"/><rect x="220" y="160" width="280" height="65" rx="8"/><rect x="550" y="90" width="150" height="95" rx="8"/></g><g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"><path d="M210 72H275"/><path d="M115 110V190H215"/><path d="M375 110V155"/><path d="M500 190H525V138H545"/></g><g font-family="Microsoft YaHei,sans-serif" text-anchor="middle" fill="#0f172a" font-size="18"><text x="115" y="66">先测 y[k]</text><text x="115" y="94">再施加 u[k]</text><text x="375" y="66">下一次读数</text><text x="375" y="94">y[k+1]</text><text x="360" y="187">同一行：回归量 + 目标</text><text x="360" y="211" font-size="15">[y[k], u[k]] → y[k+1]</text><text x="625" y="126">批量 / 递推</text><text x="625" y="156">最小二乘</text></g></svg>
