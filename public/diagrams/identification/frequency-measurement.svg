<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title desc">
<title id="title">频域辨识的测量与谱处理</title><desc id="desc">周期多正弦输入经过对象，输入与输出各受独立测量噪声影响，两路信号配对分段并计算DFT，平均互谱和自谱后得到H1。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker></defs>
<rect width="900" height="290" fill="#f8fafc" rx="12"/>
<g fill="white" stroke="#64748b" stroke-width="2"><rect x="24" y="90" width="130" height="62" rx="8"/><rect x="215" y="90" width="125" height="62" rx="8"/><circle cx="410" cy="121" r="20"/><circle cx="180" cy="210" r="20"/><rect x="475" y="88" width="175" height="150" rx="8"/><rect x="705" y="118" width="165" height="92" rx="8"/></g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M154 121H215"/><path d="M340 121H390"/><path d="M430 121H475"/><path d="M180 121V190"/><path d="M200 210H475"/><path d="M410 57V100"/><path d="M105 210H160"/><path d="M650 163H705"/></g>
<g font-family="Arial,Microsoft YaHei,sans-serif" fill="#0f172a" font-size="18" text-anchor="middle"><text x="89" y="116">周期多正弦</text><text x="89" y="140">真实输入 u</text><text x="278" y="127">对象 G</text><text x="410" y="128">+</text><text x="180" y="217">+</text><text x="410" y="40">输出噪声 v</text><text x="83" y="245">输入噪声 η</text><text x="450" y="105">yₘ</text><text x="285" y="198">uₘ</text><text x="562" y="120">配对分段 / 窗</text><text x="562" y="155">各段 DFT</text><text x="562" y="190">共轭输入 × 输出</text><text x="562" y="220">先平均谱</text><text x="787" y="151">H1 = Sᵤᵧ / Sᵤᵤ</text><text x="787" y="184">检查相干与激励</text></g>
<text x="24" y="275" font-family="Arial,Microsoft YaHei,sans-serif" font-size="16" fill="#334155">主例开环；测量噪声不进入真实对象。无激励的频点不作比值解释。</text>
</svg>
