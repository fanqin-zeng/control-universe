<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc"><title id="title">回归向量的信息方向</title><desc id="desc">恒定和交替各沿一条直线；四拍输入分别照亮两个坐标方向。箭头是回归向量，不是控制框图。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2563eb"/></marker></defs><rect width="760" height="260" rx="12" fill="#f1f5f9"/><g stroke="#94a3b8" stroke-width="1"><path d="M30 140h190M125 55v175M285 140h190M380 55v175M540 140h190M635 55v175"/></g><g stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"><path d="M125 140l58 -58M380 140l58 58M380 140l-58 -58M635 140h65M635 140h-65M635 140v-65M635 140v65"/></g><g font-family="sans-serif" font-size="17" fill="#0f172a" text-anchor="middle"><text x="125" y="30">恒定：[A,A]</text><text x="380" y="30">交替：±[A,−A]</text><text x="635" y="30">四拍：两条独立方向</text><text x="125" y="250">正交方向始终看不到</text><text x="380" y="250">变化很快仍可能秩亏</text><text x="635" y="250">每个完整周期均覆盖</text></g></svg>
