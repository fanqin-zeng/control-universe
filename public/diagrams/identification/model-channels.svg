<svg xmlns="http://www.w3.org/2000/svg" width="680" height="260" viewBox="0 0 680 260" role="img" aria-labelledby="title desc">
<title id="title">输入动态与噪声动态</title><desc id="desc">输入u经过G，驱动e经过H，两者在带正号的求和点汇合，得到输出y。输出扰动v是H的输出。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8Z" fill="#334155"/></marker></defs>
<rect width="680" height="260" rx="12" fill="#f8fafc"/>
<rect x="190" y="40" width="150" height="64" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/><rect x="190" y="158" width="150" height="64" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<circle cx="465" cy="72" r="22" fill="#fff" stroke="#334155" stroke-width="2"/>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"><path d="M75 72H184"/><path d="M340 72H438"/><path d="M75 190H184"/><path d="M340 190H465V100"/><path d="M488 72H620"/></g>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#0f172a" font-size="19"><text x="60" y="78">u</text><text x="60" y="196">e</text><text x="265" y="79">G(q)</text><text x="265" y="197">H(q)</text><text x="465" y="79">+</text><text x="637" y="78">y</text><text x="400" y="180">v</text><text x="265" y="29" font-size="15">输入通道</text><text x="265" y="248" font-size="15">噪声通道</text><text x="421" y="61" font-size="15">+</text><text x="483" y="116" font-size="15">+</text></g>
</svg>
