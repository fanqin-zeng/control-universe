<svg xmlns="http://www.w3.org/2000/svg" width="440" height="510" viewBox="0 0 440 510" role="img" aria-labelledby="title desc"><title id="title">MHE时间窗口与控制接口</title><desc id="desc">窗外历史压缩成窗口左端到达成本，窗口内观测与已知输入估计轨迹，末结点估计送入MPC；窗口起点观测只在窗口内计算一次。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="440" height="510" rx="12" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle" font-size="17" fill="#0f172a"><rect x="30" y="15" width="380" height="65" rx="10" fill="#e2e8f0" stroke="#475569"/><text x="220" y="42">窗外历史：观测到 a−1</text><text x="220" y="66" font-size="14">压缩历史，不重复放入当前窗口</text><path d="M220 80V115" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="125" width="380" height="65" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="220" y="153">到达成本 Γₐ(xₐ)</text><text x="220" y="177" font-size="14">窗口左端状态的历史代价</text><path d="M220 190V225" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="235" width="400" height="90" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="220" y="263">当前窗口 a → … → k</text><text x="220" y="289">观测 yₐ…yₖ ＋ 已知输入</text><text x="220" y="312" font-size="14">yₐ 在这里计入一次</text><path d="M220 325V360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="30" y="370" width="380" height="55" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="220" y="404">取末结点：当前状态估计</text><path d="M220 425V450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="478">送入 MPC：仍需处理估计误差</text></g></svg>
