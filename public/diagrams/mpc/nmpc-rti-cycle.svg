<svg xmlns="http://www.w3.org/2000/svg" width="440" height="610" viewBox="0 0 440 610" role="img" aria-labelledby="t d"><title id="t">NMPC模型与SQP、RTI执行关系</title><desc id="d">非线性模型保留在预测内，局部线性化构造QP。准备先于新测量，反馈更新后检查原约束和期限，合格才执行首输入。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="440" height="610" rx="12" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle" font-size="16" fill="#0f172a"><rect x="20" y="20" width="400" height="75" rx="8" fill="#dbeafe"/><text x="220" y="48">非线性预测：积分与状态递推</text><text x="220" y="76">保留sin等非线性，不等于不取导数</text><path d="M220 100V130" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="140" width="400" height="75" rx="8" fill="#e0e7ff"/><text x="220" y="168">准备：移位上一计划、算灵敏度</text><text x="220" y="196">在局部候选处构造QP近似</text><path d="M220 220V250" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="260" width="400" height="75" rx="8" fill="#d1fae5"/><text x="220" y="288">新测量到达 → 反馈：更新初态</text><text x="220" y="316">解QP，形成新的非线性计划候选</text><path d="M220 340V370" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="380" width="400" height="75" rx="8" fill="#fef3c7"/><text x="220" y="408">重评原约束、残差与执行期限</text><text x="220" y="436">QP可行不等于原NLP一定可行</text><path d="M220 460V490" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="220" y="520">合格 → 执行首输入并等待下一拍</text><text x="220" y="549">失败 → 进入另有证据的回退流程</text><text x="220" y="582">准备与自身反馈有先后依赖，不保证任意并行</text></g></svg>
