<svg xmlns="http://www.w3.org/2000/svg" width="440" height="455" viewBox="0 0 440 455" role="img" aria-labelledby="t d"><title id="t">GPC预测与滚动执行</title><desc id="d">测量及已执行输入历史形成自由响应，模型给增量到输出的映射，与参考共同进入优化，只执行首输入并更新真实历史。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="440" height="455" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="16" fill="#0f172a" text-anchor="middle"><rect x="25" y="20" width="390" height="70" rx="8" fill="#dbeafe"/><text x="220" y="48">测量 y(k)、y(k−1)，实际输入历史</text><text x="220" y="74">包含管道里尚未抵达对象的输入</text><path d="M220 95V129" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="140" width="390" height="70" rx="8" fill="#e0e7ff"/><text x="220" y="168">模型 + Diophantine：Y = G ΔU + f</text><text x="220" y="194">G：未来增量效应；f：已知历史效应</text><path d="M220 215V249" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="260" width="390" height="70" rx="8" fill="#d1fae5"/><text x="220" y="288">按参考窗口与约束求解计划</text><text x="220" y="314">核状态 / 残差 / 期限，再批准首输入</text><path d="M220 335V369" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="397">u(k) = 实际 u(k−1) + Δu(k)</text><text x="220" y="426">记录执行值，下一拍重新测量与规划</text></g></svg>
