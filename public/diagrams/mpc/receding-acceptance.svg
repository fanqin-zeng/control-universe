<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">滚动优化与执行闸门</title><desc id="desc">测量状态，计算未来计划，核验状态残差和截止时间，合格时只执行第一步，不合格时进入预先验证的回退。对象的新测量反馈到下一次计算。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2563eb"/></marker></defs>
<rect width="760" height="300" rx="12" fill="#f8fafc"/>
<g fill="#fff" stroke="#64748b" stroke-width="1.5"><rect x="20" y="35" width="125" height="70" rx="8"/><rect x="180" y="35" width="135" height="70" rx="8"/><rect x="350" y="25" width="175" height="90" rx="8"/><rect x="565" y="35" width="170" height="70" rx="8"/><rect x="350" y="175" width="175" height="65" rx="8"/></g>
<g font-family="sans-serif" text-anchor="middle" font-size="16" fill="#0f172a"><text x="82" y="64">测量/估计状态</text><text x="82" y="89">更新初始条件</text><text x="247" y="64">求解未来计划</text><text x="247" y="89">保留完整候选</text><text x="437" y="52">执行前核验</text><text x="437" y="77">状态、残差、约束</text><text x="437" y="101">截止时间</text><text x="650" y="64">只执行第一步</text><text x="650" y="89">对象继续演化</text><text x="437" y="201">已验证的回退</text><text x="437" y="225">不是任意沿用旧解</text><text x="551" y="57" font-size="13">合格</text><text x="482" y="150" font-size="13">未通过</text><text x="215" y="275">下个采样时刻：新测量 → 新计划</text></g>
<g fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"><path d="M145 70H180"/><path d="M315 70H350"/><path d="M525 70H565"/><path d="M437 115V175"/><path d="M650 105V265H82V105"/><path d="M525 208H650V105"/></g>
</svg>
