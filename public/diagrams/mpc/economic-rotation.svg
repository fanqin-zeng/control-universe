<svg xmlns="http://www.w3.org/2000/svg" width="440" height="470" viewBox="0 0 440 470" role="img" aria-labelledby="title desc">
<title id="title">经济成本旋转与终端修正</title><desc id="desc">原阶段成本减稳态成本，加当前存储减下一状态存储得到旋转成本；跨时域求和后须在终端加回存储函数。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
<rect width="440" height="470" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">
<rect x="30" y="20" width="380" height="70" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="220" y="48">原经济阶段成本</text><text x="220" y="73">ℓ(x,u) − ℓₛ</text>
<path d="M220 90V135" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="120" dx="0" transform="translate(0 0)" font-size="14"></text>
<rect x="30" y="145" width="380" height="80" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="220" y="175">加入存储的结点差额</text><text x="220" y="204">＋S(x) − S(f(x,u))</text>
<path d="M220 225V260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="270" width="380" height="65" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="220" y="297">旋转阶段成本 L(x,u)</text><text x="220" y="321" font-size="15">常价例：½(u−1)² ＋ ½h x²</text>
<path d="M220 335V370" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="380" width="400" height="70" rx="10" fill="#e2e8f0" stroke="#475569"/><text x="220" y="407">整个时域：终端项改为 V<tspan baseline-shift="sub" font-size="12">f</tspan> ＋ S</text><text x="220" y="435" font-size="14">才与原问题相差仅含初态的常数</text>
</g></svg>
