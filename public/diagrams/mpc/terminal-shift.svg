<svg xmlns="http://www.w3.org/2000/svg" width="440" height="455" viewBox="0 0 440 455" role="img" aria-labelledby="t d"><title id="t">移位后补上终端反馈</title><desc id="d">原计划执行首项，剩余计划后补终端反馈，模型一致使起点接合，终端不变性使尾点留在终端集合。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="440" height="455" rx="12" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle" fill="#0f172a" font-size="16"><rect x="25" y="20" width="390" height="70" rx="8" fill="#dbeafe"/><text x="220" y="48">原计划：u₀*, u₁*, …, uₙ₋₁*</text><text x="220" y="74">终点 xₙ* ∈ Xf</text><path d="M220 95V129" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="140" width="390" height="70" rx="8" fill="#e0e7ff"/><text x="220" y="168">只执行 u₀*，测量新状态</text><text x="220" y="194">名义证明要求：测量 = 原预测 x₁*</text><path d="M220 215V249" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="25" y="260" width="390" height="70" rx="8" fill="#d1fae5"/><text x="220" y="288">候选：u₁*, …, uₙ₋₁*, κf(xₙ*)</text><text x="220" y="314">由终端不变性，补尾后仍在 Xf</text><path d="M220 335V369" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><text x="220" y="397">候选可行 ⇒ 新最优费用 ≤ 候选费用</text><text x="220" y="426">再用终端下降条件，抵消新增尾部费用</text></g></svg>
