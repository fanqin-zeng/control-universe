<svg xmlns="http://www.w3.org/2000/svg" width="440" height="520" viewBox="0 0 440 520" role="img" aria-labelledby="title desc"><title id="title">CSTR预测控制与独立保护接口</title><desc id="desc">测量与已执行输入进入估计和QP，状态和约束通过检查才交给底层执行；独立装置保护不由预测温度截断代替。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="440" height="520" rx="12" fill="#f8fafc"/><g fill="#0f172a" font-family="sans-serif" text-anchor="middle" font-size="17"><rect x="35" y="20" width="370" height="60" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="220" y="47">测量、时间戳、已执行输入</text><text x="220" y="69" font-size="14">估计与模型一致性检查</text><path d="M220 80V110" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="120" width="370" height="70" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="220" y="149">预测模型 ＋ 约束QP</text><text x="220" y="174" font-size="14">幅值、变化率、名义预测温度界</text><path d="M220 190V220" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="230" width="370" height="70" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="220" y="258">求解状态 / 残差 / 期限检查</text><text x="220" y="284" font-size="14">失败 → 按设备预先验证的降级策略</text><path d="M220 300V330" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="35" y="340" width="370" height="60" rx="10" fill="#e2e8f0" stroke="#475569"/><text x="220" y="377">底层回路执行 → CSTR → 新测量</text><path d="M405 370H425V50H405" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="435" width="400" height="65" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="220" y="463">独立装置保护与联锁</text><text x="220" y="486" font-size="14">不靠修改仿真温度实现，须单独设计验证</text></g></svg>
