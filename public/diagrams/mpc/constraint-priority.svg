<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 525" role="img" aria-labelledby="title desc">
<title id="title">约束分阶段优化与核验</title><desc id="desc">保留不可放宽的物理与运行界，先最小化高优先松弛，再固定其结果处理次级目标，最后核验状态残差与截止时间，任何阶段失败都转到已验证处置而不是删除物理约束。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2563eb"/></marker></defs>
<rect width="440" height="525" rx="12" fill="#f8fafc"/>
<g fill="#fff" stroke="#64748b" stroke-width="1.5"><rect x="20" y="20" width="400" height="60" rx="8"/><rect x="20" y="110" width="400" height="60" rx="8"/><rect x="20" y="200" width="400" height="60" rx="8"/><rect x="20" y="290" width="400" height="80" rx="8"/><rect x="20" y="425" width="400" height="75" rx="8"/></g>
<g font-family="sans-serif" text-anchor="middle" fill="#0f172a" font-size="17"><text x="220" y="56">物理与不可放宽要求：所有阶段保留</text><text x="220" y="147">先最小化高优先级松弛 ε₁</text><text x="220" y="237">锁定 ε₁ 最优值，再处理次级目标</text><text x="220" y="324">锁定已有结果后优化性能</text><text x="220" y="350">核验状态、约束残差、截止时间</text><text x="220" y="456">任一阶段失败：已验证的处置</text><text x="220" y="485">不通过删除物理界制造可行</text><text x="356" y="405" font-size="14">失败分支 →</text></g>
<g fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"><path d="M220 80V110"/><path d="M220 170V200"/><path d="M220 260V290"/><path d="M420 140H434V462H420"/><path d="M420 230H434V462H420"/><path d="M420 330H434V462H420"/></g>
</svg>
