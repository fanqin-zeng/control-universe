<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-labelledby="t d"><title id="t">显式MPC离线生成与在线执行</title><desc id="d">离线固定模型与参数域，生成区域仿射律和证书；在线组装参数，定位区域并核对动作，域外或校验失败进入已验证处理。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="440" height="560" rx="12" fill="#f8fafc"/><g font-family="sans-serif" text-anchor="middle" font-size="16" fill="#0f172a"><rect x="25" y="20" width="390" height="70" rx="8" fill="#dbeafe"/><text x="220" y="48">离线：模型、权重、约束与参数域</text><text x="220" y="74">求参数QP，验证覆盖和KKT证书</text><path d="M220 95V129" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="140" width="390" height="70" rx="8" fill="#e0e7ff"/><text x="220" y="168">固化：多面体区域 + 仿射控制律</text><text x="220" y="194">连同模型版本、边界规则和误差预算</text><path d="M220 215V249" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="260" width="390" height="70" rx="8" fill="#d1fae5"/><text x="220" y="288">在线：估计状态、组装全部参数</text><text x="220" y="314">检查参数域，再定位和计算首输入</text><path d="M220 335V369" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><rect x="25" y="380" width="390" height="70" rx="8" fill="#fef3c7"/><text x="220" y="408">核动作约束 / 数值误差 / 期限</text><text x="220" y="434">通过才批准执行，并记录实际输入</text><path d="M220 455V489" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><text x="220" y="517">域外、未命中或核验失败</text><text x="220" y="543">进入已验证处理；不外推旧区域公式</text></g></svg>
