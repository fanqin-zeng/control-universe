<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-labelledby="title"><title id="title">先定义同一个任务，再比较可行轨迹与代价</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="760" height="250" rx="12" fill="#f8fafc"/><g fill="none" stroke="#475569" stroke-width="2"><rect x="25" y="50" width="185" height="95" rx="6"/><rect x="285" y="50" width="185" height="95" rx="6"/><rect x="545" y="50" width="185" height="95" rx="6"/><path d="M210 95H285" marker-end="url(#a)"/><path d="M470 95H545" marker-end="url(#a)"/></g><g font-family="sans-serif" font-size="20" fill="#1e293b" text-anchor="middle"><text x="118" y="83">约定任务</text><text x="118" y="116">末态、时长、限制</text><text x="378" y="83">选择可行输入</text><text x="378" y="116">动态方程决定轨迹</text><text x="638" y="83">计算并比较代价</text><text x="638" y="116">终态代价 + 积分</text><text x="380" y="205">终时固定：比努力　｜　终时自由：还要解到达时间</text></g></svg>
