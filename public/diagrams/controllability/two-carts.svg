<svg xmlns="http://www.w3.org/2000/svg" width="720" height="230" viewBox="0 0 720 230" role="img" aria-labelledby="title desc"><title id="title">两辆小车的输入和测量通路</title><desc id="desc">第一辆车连接墙弹簧，第二辆通过耦合弹簧与第一辆相连，外力只施加于第一辆，传感器只测第一辆位移。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><rect width="720" height="230" rx="12" fill="#f8fafc"/><g fill="none" stroke="#334155" stroke-width="3"><path d="M45 60V170M45 110H65l10 -12 15 24 15 -24 15 24 15 -12h30"/><rect x="165" y="80" width="140" height="70" rx="6"/><path d="M305 110h25l12 -12 15 24 15 -24 15 24 15 -12h28"/><rect x="430" y="80" width="140" height="70" rx="6"/><path d="M120 180H630M85 65H210M215 40H275" marker-end="url(#arrow)"/><path d="M245 150V200H340" marker-end="url(#arrow)"/></g><g font-family="sans-serif" font-size="19" fill="#0f172a"><text x="175" y="122">小车1 · m₁</text><text x="440" y="122">小车2 · m₂</text><text x="75" y="150">k₁</text><text x="345" y="150">k₂</text><text x="95" y="55">外力 F</text><text x="220" y="28">y₁ 正向</text><text x="350" y="206">传感器：只测 y₁</text><text x="580" y="115">y₂</text></g></svg>