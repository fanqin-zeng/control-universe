<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc"><title id="title">小车全状态反馈</title><desc id="desc">目标位置乘N，减去K乘位置与速度，形成施力；小车状态反馈到K，输出为位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="720" height="250" rx="12" fill="#f8fafc"/><g fill="none" stroke="#334155" stroke-width="2"><rect x="100" y="65" width="80" height="60" rx="6"/><circle cx="260" cy="95" r="23"/><rect x="365" y="55" width="160" height="80" rx="6"/><rect x="365" y="175" width="160" height="50" rx="6"/><path d="M40 95H100M180 95H237M283 95H365M525 95H665M580 95V200H525M365 200H260V118" marker-end="url(#arrow)"/></g><g fill="#0f172a" font-family="sans-serif" text-anchor="middle" font-size="20"><text x="60" y="75">r (m)</text><text x="140" y="102">N</text><text x="260" y="102">Σ</text><text x="217" y="85">+</text><text x="277" y="150">−</text><text x="320" y="75">u (N)</text><text x="445" y="90">弹簧小车</text><text x="445" y="118">位置、速度</text><text x="640" y="75">q (m)</text><text x="629" y="181">x=[q,q̇]ᵀ</text><text x="445" y="207">Kx</text></g></svg>
