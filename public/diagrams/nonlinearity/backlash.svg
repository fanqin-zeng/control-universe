<text x="25" y="32">① 向右拉：接触右侧，抽屉跟随</text><text x="25" y="140">② 反向推：先走空程，抽屉暂时不动</text>
<g stroke="#64748b" stroke-width="3" fill="#e2e8f0"><rect x="190" y="50" width="300" height="45" rx="4"/><rect x="190" y="158" width="300" height="45" rx="4"/></g>
