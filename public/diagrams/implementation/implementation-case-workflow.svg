<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-label="水箱控制实现与日志回归"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155"/></marker></defs><rect width="880" height="310" rx="12" fill="#f1f5f9"/><g fill="#fff" stroke="#64748b" stroke-width="2"><rect x="20" y="80" width="175" height="70" rx="8"/><rect x="245" y="80" width="175" height="70" rx="8"/><rect x="470" y="80" width="160" height="70" rx="8"/><rect x="680" y="80" width="175" height="70" rx="8"/><rect x="245" y="220" width="385" height="55" rx="8"/></g><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#172033"><text x="440" y="35" font-size="22">软件回归：合同 → 逐拍日志 → 验收</text><text x="108" y="108">测量与有效性</text><text x="108" y="133">新数据才更新</text><text x="332" y="108">整数PI</text><text x="332" y="133">冻结 / 置零</text><text x="550" y="108">限幅与量化</text><text x="550" y="133">施加输出 u</text><text x="768" y="108">离散水箱</text><text x="768" y="133">状态 y / 负载 d</text><text x="437" y="253">日志与判据：跟踪 / 峰值 / 新鲜度</text><text x="440" y="300" font-size="14">未接传感器、总线或控制板；实机时限与安全证据另行验证</text></g><g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M195 115H245"/><path d="M420 115H470"/><path d="M630 115H680"/><path d="M768 150V185H108V150"/><path d="M332 150V220"/><path d="M550 150V220"/></g><text x="440" y="180" font-family="sans-serif" font-size="14" fill="#334155">实际状态反馈（有效性另外核查）</text></svg>