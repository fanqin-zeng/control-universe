<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">区分采样与执行时刻</title><desc id="desc">采样、作业释放、等待CPU、执行、完成和输出锁存分别标记，响应时间从释放到完成，端到端延迟从采样到锁存。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#334155"/></marker></defs><rect width="900" height="300" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="17" fill="#172033" text-anchor="middle"><text x="450" y="30">一拍控制：采样准时 ≠ 计算完成准时 ≠ 输出已经生效</text><rect x="215" y="83" width="210" height="54" rx="8" fill="#fef3c7"/><text x="320" y="115">等待CPU / 被抢占</text><rect x="425" y="83" width="210" height="54" rx="8" fill="#d1fae5"/><text x="530" y="115">执行与状态提交</text><text x="80" y="66">采样</text><text x="215" y="66">释放 r</text><text x="425" y="66">开始</text><text x="635" y="66">完成 f</text><text x="805" y="66">PWM锁存</text><text x="450" y="192">响应时间：从释放到完成（包含等待/抢占）</text><text x="450" y="257">端到端延迟：从采样到实际输出锁存</text></g><g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M50 145H850"/><path d="M215 170H635"/><path d="M80 230H805"/></g><g stroke="#2563eb" stroke-width="2"><path d="M80 75V153M215 75V153M425 75V153M635 75V153M805 75V153"/></g></svg>
