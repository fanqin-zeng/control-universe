<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" role="img" aria-labelledby="t d"><title id="t">实际HIL与本页软件排练的边界</title><desc id="d">实际HIL中真实控制器经命令输出和模拟测量接口与实时对象仿真器闭环；本页下方仅软件控制函数、虚拟时钟和模型，不连接物理硬件。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="840" height="320" rx="12" fill="#f1f5f9"/><g stroke="#64748b" fill="white" stroke-width="2"><rect x="35" y="48" width="235" height="95" rx="8"/><rect x="540" y="48" width="265" height="95" rx="8"/><rect x="35" y="221" width="770" height="72" rx="8" stroke-dasharray="6 4"/></g><g font-family="sans-serif" fill="#172033" font-size="18" text-anchor="middle"><text x="420" y="27">实际硬件在环：真实控制器 + 实时对象模型</text><text x="153" y="84">被测控制器 / 固件</text><text x="153" y="116">真实输入输出接口</text><text x="673" y="84">实时仿真器 + 信号调理</text><text x="673" y="116">受控对象模型</text><text x="405" y="65">命令 u →</text><text x="405" y="143">← 模拟测量 y</text><text x="420" y="185">需核电平、量程、映射、时钟、求解步长和期限</text><text x="420" y="250">本页：软件控制函数 → 下一拍锁存 → Euler对象 / 同输入精确影子</text><text x="420" y="278">仅虚拟时钟与故障序列；未接控制板、未测真实I/O或实时性能</text></g><g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M270 80H538"/><path d="M540 118H272"/></g></svg>