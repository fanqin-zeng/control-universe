<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="t d"><title id="t">带网络的采样反馈</title><desc id="d">状态采样包带序号和采样时刻，通过网络时延丢包后到达接收器，按序号更新保持值，控制器计算输入推进对象。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="840" height="270" rx="12" fill="#f1f5f9"/><g fill="white" stroke="#64748b" stroke-width="2"><rect x="25" y="40" width="170" height="78" rx="8"/><rect x="265" y="40" width="240" height="78" rx="8"/><rect x="575" y="40" width="240" height="78" rx="8"/><rect x="575" y="176" width="240" height="65" rx="8"/><rect x="25" y="176" width="310" height="65" rx="8"/></g><g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#172033"><text x="110" y="72">采样 x[k]</text><text x="110" y="99">seq=k, stamp=kT</text><text x="385" y="72">网络：时延 / 丢包</text><text x="385" y="99">到达顺序可能改变</text><text x="695" y="72">接收器检查序号</text><text x="695" y="99">更新并保持测量值</text><text x="695" y="216">控制器 u=-K×保持值</text><text x="180" y="216">对象 x[k+1]=1.1x[k]+0.1u[k]</text></g><g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"><path d="M195 79H263"/><path d="M505 79H573"/><path d="M695 118V174"/><path d="M575 209H337"/><path d="M110 176V120"/></g><text x="414" y="159" font-family="sans-serif" font-size="16" fill="#475569">只给传感器链路加网络</text></svg>