<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">三类控制部署架构</title><desc id="desc">PLC把HMI、控制任务和远程IO相连；DCS由操作站连接多个可局部控制的站点；嵌入式控制器连接ADC、PWM和本地对象。跨站网络与共享供电仍可能是共同故障点。</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155"/></marker></defs>
<rect width="760" height="350" rx="12" fill="#f8fafc"/>
<g stroke="#64748b" fill="white"><rect x="25" y="60" width="210" height="45" rx="6"/><rect x="25" y="145" width="210" height="45" rx="6"/><rect x="25" y="230" width="210" height="45" rx="6"/><rect x="275" y="60" width="210" height="45" rx="6"/><rect x="275" y="145" width="95" height="45" rx="6"/><rect x="390" y="145" width="95" height="45" rx="6"/><rect x="275" y="230" width="210" height="45" rx="6"/><rect x="525" y="60" width="210" height="45" rx="6"/><rect x="525" y="145" width="210" height="45" rx="6"/><rect x="525" y="230" width="210" height="45" rx="6"/></g>
<g font-family="sans-serif" font-size="16" fill="#172033" text-anchor="middle"><text x="130" y="30">PLC系统</text><text x="380" y="30">DCS系统</text><text x="630" y="30">嵌入式系统</text><text x="130" y="88">HMI操作站</text><text x="130" y="173">PLC周期控制任务</text><text x="130" y="258">本地/远程I/O与对象</text><text x="380" y="88">操作站/历史服务器</text><text x="322" y="173">控制站A</text><text x="438" y="173">控制站B</text><text x="380" y="258">各站I/O与局部对象</text><text x="630" y="88">上位机：参数/记录</text><text x="630" y="173">MCU/DSP/FPGA</text><text x="630" y="258">ADC/PWM与本地对象</text><text x="380" y="322">箭头为管理命令或双向I/O联系；闭环反馈详见上图</text></g>
