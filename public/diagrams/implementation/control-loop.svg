<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc">
<title id="title">数字反馈控制的测量、计算与输出</title><desc id="desc">参考值进入比较点的正端。对象输出经过传感、抗混叠滤波和ADC后成为数字测量，进入比较点负端。误差经过控制器及DAC保持或PWM驱动对象。管理站只向控制器发送设定值。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155"/></marker></defs>
<rect width="760" height="290" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="16" fill="#172033" text-anchor="middle">
<g stroke="#64748b" fill="white"><circle cx="115" cy="105" r="22"/><rect x="185" y="77" width="120" height="56" rx="8"/><rect x="350" y="77" width="150" height="56" rx="8"/><rect x="550" y="77" width="150" height="56" rx="8"/><rect x="440" y="205" width="220" height="56" rx="8"/><rect x="180" y="205" width="180" height="56" rx="8"/><rect x="180" y="10" width="220" height="42" rx="8"/></g>
<text x="45" y="82">r[k]</text><text x="92" y="91">+</text><text x="130" y="131">−</text><text x="156" y="92">e[k]</text><text x="245" y="110">数字控制器</text><text x="425" y="102">DAC＋保持</text><text x="425" y="122">或PWM＋驱动</text><text x="625" y="102">执行器</text><text x="625" y="122">＋被控对象</text><text x="714" y="154">y(t)</text><text x="550" y="228">传感器＋信号调理</text><text x="550" y="249">抗混叠滤波</text><text x="270" y="228">采样＋ADC量化</text><text x="270" y="249">数字测量 y[k]</text><text x="290" y="37">管理站：设定值/监视</text></g>
