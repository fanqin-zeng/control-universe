<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 245" role="img" aria-labelledby="title desc"><title id="title">位置速度级联控制</title><desc id="desc">位置误差进入外环控制器，输出速度设定。速度误差进入内环控制器及速度对象，速度经积分成为位置。两个测量分别负反馈到各自比较点。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155"/></marker></defs><rect width="800" height="245" fill="#f8fafc"/><g fill="#fff" stroke="#334155" stroke-width="2"><circle cx="82" cy="80" r="20"/><rect x="125" y="50" width="110" height="60" rx="6"/><circle cx="300" cy="80" r="20"/><rect x="345" y="50" width="110" height="60" rx="6"/><rect x="500" y="50" width="105" height="60" rx="6"/><rect x="665" y="50" width="70" height="60" rx="6"/></g><g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M10 80H62"/><path d="M102 80H125"/><path d="M235 80H280"/><path d="M320 80H345"/><path d="M455 80H500"/><path d="M605 80H665"/><path d="M735 80H785"/><path d="M635 80V155H300V100"/><path d="M760 80V210H82V100"/></g><g font-family="sans-serif" font-size="16" fill="#172033" text-anchor="middle"><text x="32" y="62">位置r</text><text x="180" y="77">外环P</text><text x="180" y="99">20 ms</text><text x="258" y="40">速度设定</text><text x="400" y="77">内环PI</text><text x="400" y="99">5 ms</text><text x="552" y="75">速度对象</text><text x="552" y="97">G₂</text><text x="635" y="62">速度v</text><text x="700" y="86">1/s</text><text x="765" y="40">位置q</text><text x="57" y="67">+</text><text x="100" y="123">−</text><text x="275" y="67">+</text><text x="320" y="124">−</text><text x="435" y="178">速度负反馈</text><text x="420" y="235">位置负反馈</text></g></svg>
