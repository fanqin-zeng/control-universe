<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="t d"><title id="t">从线路到工程量的工业通信接口</title><desc id="d">PLC经RS485发送请求并接收响应，依次检查CRC设备功能长度，再按寄存器表解释类型和单位，只有有效数据进入控制任务。下方标出请求静默额外处理响应末尾静默五段预算。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="840" height="270" rx="12" fill="#f1f5f9"/><g fill="white" stroke="#64748b" stroke-width="2"><rect x="20" y="35" width="165" height="85" rx="8"/><rect x="265" y="35" width="180" height="85" rx="8"/><rect x="510" y="35" width="305" height="85" rx="8"/></g><g fill="#172033" font-family="sans-serif" font-size="18" text-anchor="middle"><text x="103" y="66">PLC / 发起端</text><text x="103" y="99">读取请求 →</text><text x="355" y="66">RS-485线路</text><text x="355" y="99">字节与帧边界</text><text x="663" y="66">设备寄存器 / 响应</text><text x="663" y="99">类型、比例、单位由设备表定义</text><text x="420" y="162">响应 → 完整性与CRC → 设备/功能/长度 → 工程量与有效性 → 控制任务</text></g><g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M185 61H263"/><path d="M445 61H508"/><path d="M510 104H447"/><path d="M265 104H187"/></g><g font-family="sans-serif" font-size="16" text-anchor="middle"><path d="M25 205H815" stroke="#475569"/><rect x="25" y="190" width="195" height="40" fill="#dbeafe"/><rect x="220" y="190" width="125" height="40" fill="#e2e8f0"/><rect x="345" y="190" width="150" height="40" fill="#fef3c7"/><rect x="495" y="190" width="195" height="40" fill="#dcfce7"/><rect x="690" y="190" width="125" height="40" fill="#e2e8f0"/><text x="122" y="216">请求</text><text x="282" y="216">静默</text><text x="420" y="216">额外处理预留</text><text x="592" y="216">响应</text><text x="752" y="216">末尾静默</text><text x="420" y="254" fill="#475569">五段顺序预留，示意图不按时长比例</text></g></svg>