<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
<title id="title">PID工程整定流程</title><desc id="desc">从要求和边界到受控小阶跃、局部模型、PI候选、多工况检验和受监控试运行。检验失败返回模型或要求，试运行异常按约定停止并恢复。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#334155"/></marker></defs>
<rect width="760" height="310" rx="12" fill="#f8fafc"/>
<g fill="#e0f2fe" stroke="#0369a1" stroke-width="2"><rect x="20" y="35" width="160" height="65" rx="8"/><rect x="220" y="35" width="150" height="65" rx="8"/><rect x="410" y="35" width="140" height="65" rx="8"/><rect x="590" y="35" width="150" height="65" rx="8"/><rect x="390" y="175" width="180" height="65" rx="8"/><rect x="70" y="175" width="230" height="65" rx="8"/></g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M180 67H220"/><path d="M370 67H410"/><path d="M550 67H590"/><path d="M665 100V207H570"/><path d="M390 207H300"/><path d="M480 175V130H100V100"/></g>
<g fill="#0f172a" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="100" y="62">要求与试验边界</text><text x="100" y="86" font-size="14">范围、判停、恢复点</text><text x="295" y="63">受控小阶跃</text><text x="295" y="86" font-size="14">记录实际输入输出</text><text x="480" y="63">局部模型</text><text x="480" y="86" font-size="14">K、T、L与残差</text><text x="665" y="63">PI候选</text><text x="665" y="86" font-size="14">形式、单位、λ</text><text x="480" y="202">多工况检验</text><text x="480" y="226" font-size="14">误差、超调、指令代价</text><text x="185" y="202">受监控试运行</text><text x="185" y="226" font-size="14">批准后逐步扩大、异常回退</text><text x="300" y="121" font-size="14">失败：检查模型或修正要求</text><text x="345" y="197" font-size="13">通过</text><text x="380" y="285" font-size="15">教学模型通过 ≠ 现场已验收；参数与状态都要可追溯</text></g>
</svg>
