<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="title desc"><title id="title">控制器逐拍部署时序</title><desc id="desc">采样并冻结当前输入；读取旧输出与旧输入；生成本拍输出；最后提交新历史。实际输出送达若晚一拍，必须进入闭环模型。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8" fill="#334155"/></marker></defs><rect width="760" height="270" rx="12" fill="#f8fafc"/><g fill="#e0f2fe" stroke="#0369a1" stroke-width="2"><rect x="20" y="45" width="150" height="70" rx="8"/><rect x="210" y="45" width="160" height="70" rx="8"/><rect x="410" y="45" width="140" height="70" rx="8"/><rect x="590" y="45" width="150" height="70" rx="8"/><rect x="210" y="170" width="340" height="55" rx="8"/></g><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M170 80H210"/><path d="M370 80H410"/><path d="M550 80H590"/><path d="M665 115V197H550"/><path d="M210 197H95V115"/></g><g font-family="sans-serif" text-anchor="middle" fill="#0f172a"><text x="95" y="73" font-size="18">采样并锁定</text><text x="95" y="98" font-size="15">当前输入 e[k]</text><text x="290" y="73" font-size="18">读取旧历史</text><text x="290" y="98" font-size="15">u[k−1]、e[k−1]</text><text x="480" y="73" font-size="18">计算本拍输出</text><text x="480" y="98" font-size="15">宽乘加、舍入</text><text x="665" y="73" font-size="18">送到执行器</text><text x="665" y="98" font-size="15">记录真实送达时刻</text><text x="380" y="204" font-size="18">最后提交两份新历史，再等下一拍</text><text x="380" y="250" font-size="15">不能提前覆盖旧输入；实际额外延迟必须回到闭环检验</text></g></svg>
