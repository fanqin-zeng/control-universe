<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
<title id="title">直接力矩单摆的模糊反馈回路</title><desc id="desc">目标零角度与测量角度相减得到误差，速度取负后一起归一化，经Mamdani推理、输出缩放、限幅和保持器驱动单摆，角度反馈到负端。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#334155"/></marker></defs>
<rect width="900" height="260" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#0f172a">
<circle cx="85" cy="100" r="22" fill="white" stroke="#334155" stroke-width="2"/>
<text x="62" y="83">+</text><text x="62" y="128">−</text><text x="25" y="80">0</text>
<rect x="160" y="65" width="130" height="70" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="225" y="93">输入缩放</text><text x="225" y="119">Ge、Gce</text>
<rect x="340" y="65" width="140" height="70" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="410" y="94">Mamdani</text><text x="410" y="119">规则与精确重心</text>
<rect x="530" y="65" width="140" height="70" rx="7" fill="#dcfce7" stroke="#15803d"/><text x="600" y="94">Gu → 限幅</text><text x="600" y="119">每拍保持2 ms</text>
<rect x="720" y="65" width="130" height="70" rx="7" fill="#fef3c7" stroke="#b45309"/><text x="785" y="94">直接力矩单摆</text><text x="785" y="119">角度 θ</text>
<text x="129" y="82">e</text><text x="691" y="82">u</text><text x="860" y="82">θ</text>
<text x="225" y="185">de = −角速度（理想测量）</text><text x="560" y="224">测量角度回到比较点负端</text>
</g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M15 100H61"/><path d="M108 100H158"/><path d="M291 100H338"/><path d="M481 100H528"/><path d="M671 100H718"/><path d="M851 100H885"/>
<path d="M873 100V230H85V124"/><path d="M225 169V138"/>
</g>
</svg>
