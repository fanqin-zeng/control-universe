<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" role="img" aria-labelledby="title desc">
<title id="title">把洗衣经验变成确定输出</title><desc id="desc">污渍和衣物读数依次经过隶属度、规则激活、结论聚合与解模糊得到洗涤时长。装进反馈时还须检查对象与约束。</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs>
<rect width="780" height="230" rx="14" fill="#f1f5f9"/>
<g font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">
<text x="390" y="31" font-size="20">把“污渍偏重、衣服偏多，就多洗一会儿”写成计算</text>
<g fill="#fff" stroke="#64748b" stroke-width="1.5"><rect x="15" y="65" width="130" height="85" rx="8"/><rect x="170" y="65" width="130" height="85" rx="8"/><rect x="325" y="65" width="130" height="85" rx="8"/><rect x="480" y="65" width="130" height="85" rx="8"/><rect x="635" y="65" width="130" height="85" rx="8"/></g>
<text x="80" y="97">明确读数</text><text x="80" y="128" font-size="14">污渍、衣物量</text>
<text x="235" y="97">模糊化</text><text x="235" y="128" font-size="14">各语言值隶属度</text>
<text x="390" y="97">规则激活</text><text x="390" y="128" font-size="14">与、蕴含</text>
<text x="545" y="97">聚合</text><text x="545" y="128" font-size="14">合并结论集合</text>
<text x="700" y="97">解模糊化</text><text x="700" y="128" font-size="14">明确洗涤时长</text>
<text x="390" y="193" font-size="16">静态决策可直接检查单调性；用于反馈时还要验证闭环稳定性与饱和。</text>
</g><g stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M145 108H168"/><path d="M300 108H323"/><path d="M455 108H478"/><path d="M610 108H633"/></g></svg>
