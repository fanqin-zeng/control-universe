<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">具身系统的物理闭环与动作接口</title><desc id="desc">任务指令进入策略，策略动作经接口与低层控制作用到身体和环境，再由传感器返回带时间戳的观测。安全监控可触发停止。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs>
<rect width="960" height="350" rx="12" fill="#f8fafc"/>
<g fill="#e0f2fe" stroke="#0369a1" stroke-width="2"><rect x="30" y="110" width="175" height="90" rx="8"/><rect x="280" y="110" width="175" height="90" rx="8"/><rect x="535" y="110" width="180" height="90" rx="8"/><rect x="765" y="110" width="165" height="90" rx="8"/></g>
<g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" fill="#0f172a" font-size="19"><text x="118" y="147">策略 / 记忆</text><text x="118" y="177" font-size="15">任务、观测历史 → 动作</text><text x="368" y="147">动作接口与内环</text><text x="368" y="177" font-size="15">单位、坐标系、限幅</text><text x="625" y="147">身体与环境</text><text x="625" y="177" font-size="15">运动、接触、扰动</text><text x="848" y="147">传感器</text><text x="848" y="177" font-size="15">图像、关节、触觉</text><text x="118" y="40">任务：把杯子移到标记</text><text x="455" y="292">带时间戳的观测 o、有效性标记</text><text x="625" y="40" font-size="17">独立监控 / 停止条件</text></g>
<g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"><path d="M118 52V108"/><path d="M205 155H278"/><path d="M455 155H533"/><path d="M715 155H763"/><path d="M848 202V245H118V202"/><path d="M625 52V80H368V108"/></g>
<g font-family="Microsoft YaHei, sans-serif" fill="#334155" font-size="15" text-anchor="middle"><text x="243" y="138">动作 a</text><text x="494" y="138">输入 u</text><text x="740" y="224">物理量</text><text x="480" y="328">策略动作不是电机输入；观测也不是完整真实状态。</text></g>
</svg>
