<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
<title id="title">非同步Buck功率通路与电压负反馈</title>
<desc id="desc">直流输入经开关和电感到输出，电容与电阻并接地。续流二极管阳极接地、阴极接开关节点。测量电压从输出返回比较点的负端，控制器输出占空比到PWM。</desc>
