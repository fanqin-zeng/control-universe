<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">机器人模型中的信号与几何关系</title><desc id="desc">目标、控制器、驱动器和机器人从左到右连接。状态经过传感器反馈，构型经过几何模型变为任务量。力指令和实际力分开标记。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="760" height="300" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#0f172a">
<g fill="#e0f2fe" stroke="#0369a1" stroke-width="2"><rect x="95" y="48" width="110" height="64" rx="8"/><rect x="282" y="48" width="110" height="64" rx="8"/><rect x="487" y="48" width="144" height="64" rx="8"/><rect x="480" y="207" width="155" height="55" rx="8"/><rect x="480" y="137" width="155" height="48" rx="8"/></g>
<text x="35" y="85">目标</text><text x="150" y="85">控制器</text><text x="337" y="85">驱动器</text><text x="559" y="85">机器人运动</text><text x="557" y="241">传感器模型</text><text x="557" y="167">几何模型</text>
<text x="242" y="40" font-size="15">力指令 u_c</text><text x="438" y="40" font-size="15">实际力 u</text><text x="687" y="85">状态 x</text><text x="693" y="166">任务量 p</text><text x="310" y="254">读数 y</text><text x="675" y="131" font-size="14">构型 q</text>
</g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M63 80H95"/><path d="M205 80H282"/><path d="M392 80H487"/><path d="M631 80H647"/><path d="M640 82V162H635"/><path d="M635 162H654"/><path d="M640 82V234H635"/><path d="M480 234H150V114"/></g>
<text x="95" y="285" font-family="sans-serif" font-size="14" fill="#475569">示意结构：任务量、状态、指令、实际力和读数各有明确含义；滑台算例仅验证开环对象。</text>
</svg>
