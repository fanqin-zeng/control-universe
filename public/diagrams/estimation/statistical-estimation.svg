<svg xmlns="http://www.w3.org/2000/svg" width="500" height="360" viewBox="0 0 500 360" role="img" aria-labelledby="title desc">
<title id="title">两支温度计估计同一个温度</title><desc id="desc">短时间内假定真实温度相同，两支温度计输出不同读数与已知误差方差；数据和声明的模型共同决定估计。高斯先验是额外的信息来源。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
<rect width="500" height="360" rx="12" fill="#f8fafc"/>
<g fill="#fff" stroke="#64748b" stroke-width="2"><rect x="110" y="15" width="280" height="60" rx="8"/><rect x="15" y="120" width="220" height="90" rx="8"/><rect x="265" y="120" width="220" height="90" rx="8"/><rect x="110" y="270" width="280" height="70" rx="8"/></g>
<g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"><path d="M190 75V97H125V118"/><path d="M310 75V97H375V118"/><path d="M125 210V238H190V268"/><path d="M375 210V238H310V268"/></g>
<g font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#0f172a" text-anchor="middle"><text x="250" y="53">同一恒定温度 θ</text><text x="125" y="154">温度计一：22°C</text><text x="125" y="187">误差方差：4°C²</text><text x="375" y="154">温度计二：24°C</text><text x="375" y="187">误差方差：1°C²</text><text x="250" y="300">数据 ＋ 声明的模型</text><text x="250" y="327">选择估计目标与求解</text></g>
</svg>
