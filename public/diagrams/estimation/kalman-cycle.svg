<svg xmlns="http://www.w3.org/2000/svg" width="500" height="350" viewBox="0 0 500 350" role="img" aria-labelledby="title desc">
<title id="title">预测与测量校正</title><desc id="desc">上一拍后验经模型和过程噪声形成先验，本拍测量与预测读数相减形成创新，校正得到后验再循环。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2563eb"/></marker></defs>
<rect width="500" height="350" rx="15" fill="#f8fafc"/>
<g fill="#eff6ff" stroke="#2563eb" stroke-width="2"><rect x="25" y="55" width="180" height="75" rx="8"/><rect x="280" y="55" width="195" height="75" rx="8"/><rect x="280" y="235" width="195" height="75" rx="8"/><circle cx="375" cy="180" r="27"/></g>
<g fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"><path d="M205 92H275"/><path d="M375 130V150"/><path d="M375 207V230"/><path d="M280 272H115V135"/><path d="M180 180H340"/></g>
<g font-family="Microsoft YaHei, sans-serif" fill="#0f172a" font-size="21" text-anchor="middle"><text x="115" y="85">上一拍后验</text><text x="115" y="115">状态 + 方差</text><text x="375" y="85">模型预测</text><text x="375" y="115">加入过程噪声</text><text x="375" y="280">本拍后验</text><text x="375" y="185">−</text><text x="92" y="186">本拍读数</text><text x="232" y="170">+</text><text x="450" y="181">创新</text><text x="228" y="254">增益校正</text><text x="250" y="32">每一拍：先预测，再校正</text></g>
</svg>
