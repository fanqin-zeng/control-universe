<svg xmlns="http://www.w3.org/2000/svg" width="500" height="330" viewBox="0 0 500 330" role="img" aria-labelledby="t d"><title id="t">EKF均值与误差两条计算路径</title><desc id="d">状态均值经非线性f预测再经h给出预测读数，误差协方差经对应雅可比传播，创新与增益用于校正，两路重新汇合。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#2563eb"/></marker></defs><rect width="500" height="330" fill="#f8fafc" rx="12"/><g fill="#eff6ff" stroke="#2563eb" stroke-width="2"><rect x="20" y="50" width="210" height="65" rx="7"/><rect x="270" y="50" width="210" height="65" rx="7"/><rect x="20" y="155" width="210" height="65" rx="7"/><rect x="270" y="155" width="210" height="65" rx="7"/><rect x="120" y="265" width="260" height="45" rx="7"/></g><g fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#a)"><path d="M230 82H265"/><path d="M230 187H265"/><path d="M375 115V150"/><path d="M375 220V242H250V260"/><path d="M125 115V150"/></g><g font-family="Microsoft YaHei,sans-serif" font-size="21" text-anchor="middle" fill="#0f172a"><text x="250" y="30">均值与误差：不同的传播方式</text><text x="125" y="77">上一拍后验均值</text><text x="125" y="103">经过非线性 f</text><text x="375" y="77">本拍先验均值</text><text x="375" y="103">经过非线性 h</text><text x="125" y="183">用 F 传播误差</text><text x="125" y="209">加入过程协方差</text><text x="375" y="183">用 H 形成创新方差</text><text x="375" y="209">计算校正增益 K</text><text x="250" y="295">用真实预测读数计算创新</text></g></svg>
