<svg xmlns="http://www.w3.org/2000/svg" width="360" height="600" viewBox="0 0 360 600" role="img" aria-labelledby="title desc">
<title id="title">两路数据的融合前检查</title><desc id="desc">先核对时间坐标和数据来源，原始观测保留联合协方差，局部后验检查共享先验和历史；只在条件成立时使用独立相加或协方差交集。</desc>
<rect width="360" height="600" rx="12" fill="#f1f5f9"/>
<g fill="#0f172a" font-family="sans-serif" text-anchor="middle" font-size="17">
<text x="180" y="34" font-weight="bold">两路数据 ≠ 两份独立信息</text>
<rect x="20" y="57" width="320" height="84" rx="8" fill="#dbeafe"/><text x="180" y="86">先对齐物理量、单位与坐标</text><text x="180" y="116">核对时间戳与不确定性传播</text>
<path d="M180 146v26m-6-6 6 6 6-6" stroke="#334155" fill="none" stroke-width="2"/>
<rect x="20" y="183" width="320" height="88" rx="8" fill="#dcfce7"/><text x="180" y="212">原始观测：保留完整 R</text><text x="180" y="242">确认条件独立，才分路相加</text>
<path d="M180 277v26m-6-6 6 6 6-6" stroke="#334155" fill="none" stroke-width="2"/>
<rect x="20" y="315" width="320" height="92" rx="8" fill="#fef3c7"/><text x="180" y="344">局部后验：查共享先验与历史</text><text x="180" y="375">来源未知，不能直接相加精度</text>
<path d="M180 413v26m-6-6 6 6 6-6" stroke="#334155" fill="none" stroke-width="2"/>
<rect x="20" y="451" width="320" height="122" rx="8" fill="#e2e8f0"/><text x="180" y="479">已知共享项：按合同扣重</text><text x="180" y="510">未知相关：评估 CI 有效上界</text><text x="180" y="545" font-weight="bold">重复消息不产生新信息</text>
</g></svg>
