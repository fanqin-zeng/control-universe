<svg xmlns="http://www.w3.org/2000/svg" width="520" height="480" viewBox="0 0 520 480" role="img" aria-labelledby="title desc">
<title id="title">状态估计的预测与修正</title><desc id="desc">上次估计和已知输入经动态模型预测当前状态；测量模型给出预测读数，与当前测量相减得到新息。预测状态与新息共同进入当前状态修正。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs>
<rect width="520" height="480" rx="12" fill="#f8fafc"/>
<g fill="#fff" stroke="#64748b" stroke-width="2"><rect x="20" y="20" width="210" height="65" rx="8"/><rect x="20" y="125" width="210" height="80" rx="8"/><rect x="290" y="125" width="210" height="80" rx="8"/><rect x="290" y="280" width="210" height="80" rx="8"/><rect x="155" y="405" width="235" height="60" rx="8"/></g>
<g font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#0f172a" text-anchor="middle"><text x="125" y="47">上次估计</text><text x="125" y="73">与已知输入</text><text x="125" y="157">动态模型</text><text x="125" y="185">预测当前状态</text><text x="395" y="171">当前测量</text><text x="395" y="312">新息</text><text x="395" y="340">测量 − 预测读数</text><text x="272" y="443">当前状态修正</text><text x="79" y="310">预测状态</text><text x="260" y="243">经测量模型</text></g>
<g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"><path d="M125 85V123"/><path d="M230 165H260V320H288"/><path d="M395 205V278"/><path d="M125 205V435H153"/><path d="M395 360V435H392"/></g>
<rect x="188" y="221" width="144" height="32" fill="#f8fafc"/>
<text x="260" y="243" font-family="Microsoft YaHei, sans-serif" font-size="21" text-anchor="middle" fill="#0f172a">经测量模型</text>
</svg>
