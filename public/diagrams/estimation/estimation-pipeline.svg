<svg xmlns="http://www.w3.org/2000/svg" width="360" height="650" viewBox="0 0 360 650" role="img" aria-labelledby="title desc"><title id="title">小车估计的逐拍信息流</title><desc id="desc">共同预测只做一次；每路数据核可用性与创新，缺测或拒收不更新；记录诊断后进入下一秒。</desc><rect width="360" height="650" rx="12" fill="#f1f5f9"/><g font-family="sans-serif" font-size="17" fill="#0f172a" text-anchor="middle"><text x="180" y="32" font-weight="bold">每秒一次共同预测</text><rect x="18" y="55" width="324" height="85" rx="8" fill="#dbeafe"/><text x="180" y="85">上一拍估计 + 运动模型</text><text x="180" y="117">输出当前预测与协方差</text><path d="M180 146v26m-6-6 6 6 6-6" stroke="#334155" stroke-width="2" fill="none"/><rect x="18" y="183" width="324" height="108" rx="8" fill="#dcfce7"/><text x="180" y="212">传感器 1：有数据吗？</text><text x="180" y="242">计算创新 / S / NIS</text><text x="180" y="274">接受才更新；缺测或拒收跳过</text><path d="M180 297v26m-6-6 6 6 6-6" stroke="#334155" stroke-width="2" fill="none"/><rect x="18" y="335" width="324" height="108" rx="8" fill="#fef3c7"/><text x="180" y="364">传感器 2：接着上一步结果</text><text x="180" y="394">有数据且接受，才再次更新</text><text x="180" y="426">同一时间不再预测一次</text><path d="M180 449v26m-6-6 6 6 6-6" stroke="#334155" stroke-width="2" fill="none"/><rect x="18" y="487" width="324" height="135" rx="8" fill="#e2e8f0"/><text x="180" y="516">输出位置 / 速度 / 协方差</text><text x="180" y="547">记录可用性、创新与拒收原因</text><text x="180" y="578">离线用独立真值评分</text><text x="180" y="607" font-weight="bold">下一秒继续；本例 12 拍停止</text></g></svg>
