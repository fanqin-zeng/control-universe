<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" role="img" aria-labelledby="title desc">
<title id="title">粒子加权与按需重采样</title><desc id="desc">状态转移传播粒子，再用测量似然更新权重；先记录统计量，仅在阈值触发时复制祖先并重置权重。重采样不提供新的传感器信息。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs>
<rect width="440" height="430" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" text-anchor="middle" fill="#0f172a"><text x="220" y="28" font-size="19">带权位置假设，逐拍更新</text>
<rect x="20" y="45" width="400" height="78" rx="10" fill="#dbeafe"/><text x="220" y="73" font-size="17">① 状态转移：传播每个粒子</text><text x="220" y="103" font-size="16">位置可变化，过程噪声在此采样</text>
<rect x="20" y="156" width="400" height="90" rx="10" fill="#e0e7ff"/><text x="220" y="183" font-size="17">② 观测似然：更新并归一化权重</text><text x="220" y="214" font-size="16">先记录加权矩、分支概率与ESS</text>
<rect x="20" y="279" width="400" height="90" rx="10" fill="#dcfce7"/><text x="220" y="306" font-size="17">③ 阈值触发：复制祖先，重置等权</text><text x="220" y="338" font-size="16">未触发时，保留原来的非均匀权重</text>
<text x="220" y="403" font-size="16">重采样不会读取新数据，也不能新造一个峰</text></g>
<path d="M220 127V148" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/><path d="M220 250V271" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
