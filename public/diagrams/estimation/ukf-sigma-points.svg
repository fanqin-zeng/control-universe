<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" role="img" aria-labelledby="title desc">
<title id="title">sigma点传播平方观测</title>
<desc id="desc">输入点2、2.5、1.5经过平方函数得到4、6.25、2.25；用两套权重计算输出均值4.25、方差4.125和交叉协方差1。三个步骤从上到下排列。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563eb"/></marker></defs>
<rect width="440" height="420" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" text-anchor="middle" fill="#0f172a">
<text x="220" y="28" font-size="19">代表性位置经过模型，再合成矩</text>
<rect x="20" y="45" width="400" height="105" rx="10" fill="#dbeafe"/>
<g font-size="17"><text x="220" y="71">① 输入：μ=2，P=0.25</text>
<text x="220" y="101">位置点：2 / 2.5 / 1.5</text>
<text x="220" y="131">均值权重：0 / ½ / ½；方差权重：2 / ½ / ½</text></g>
<rect x="20" y="182" width="400" height="69" rx="10" fill="#e0e7ff"/>
<g font-size="17"><text x="220" y="207">② 逐点通过 h(x)=x²</text><text x="220" y="235">输出：4 / 6.25 / 2.25</text></g>
<rect x="20" y="283" width="400" height="80" rx="10" fill="#dcfce7"/>
<g font-size="17"><text x="220" y="310">③ 加权均值 4.25；输出方差 4.125</text><text x="220" y="341">输入输出交叉协方差 1</text></g>
<text x="220" y="394" font-size="16">确定性求积节点，不表示车辆实际运动轨迹</text>
</g>
<path d="M220 154V175M220 255V276" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
