<svg xmlns="http://www.w3.org/2000/svg" width="800" height="290" viewBox="0 0 800 290" role="img" aria-labelledby="title desc">
<title id="title">物理对象与通信关系分层</title><desc id="desc">上层三台本地控制器双向交换速度；下层三辆小车分别接收自己的加速度输入并反馈速度，通信线不是车道或物理连接。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
<rect width="800" height="290" rx="12" fill="#f8fafc"/>
<g fill="#0f172a" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="400" y="27">信息层：交换邻居的速度，不由中央计算动作</text>
<g fill="#dbeafe" stroke="#2563eb" stroke-width="2"><rect x="55" y="48" width="170" height="54" rx="8"/><rect x="315" y="48" width="170" height="54" rx="8"/><rect x="575" y="48" width="170" height="54" rx="8"/></g>
<text x="140" y="82">本地控制器 1</text><text x="400" y="82">本地控制器 2</text><text x="660" y="82">本地控制器 3</text>
<g stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"><path d="M230 75H310"/><path d="M490 75H570"/></g>
<g stroke="#475569" stroke-width="2" marker-end="url(#arrow)"><path d="M110 106V179"/><path d="M370 106V179"/><path d="M630 106V179"/><path d="M170 179V106"/><path d="M430 179V106"/><path d="M690 179V106"/></g>
<g font-size="14"><text x="88" y="145">u₁</text><text x="190" y="145">v₁</text><text x="348" y="145">u₂</text><text x="450" y="145">v₂</text><text x="608" y="145">u₃</text><text x="710" y="145">v₃</text></g>
<g fill="#dcfce7" stroke="#15803d" stroke-width="2"><rect x="55" y="184" width="170" height="54" rx="8"/><rect x="315" y="184" width="170" height="54" rx="8"/><rect x="575" y="184" width="170" height="54" rx="8"/></g>
<text x="140" y="218">小车 1</text><text x="400" y="218">小车 2</text><text x="660" y="218">小车 3</text><text x="400" y="272">物理层：独立车道；每辆车只有自己的输入和状态</text></g></svg>
