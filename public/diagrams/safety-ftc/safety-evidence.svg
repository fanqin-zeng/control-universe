<svg xmlns="http://www.w3.org/2000/svg" width="440" height="490" viewBox="0 0 440 490" role="img" aria-labelledby="title desc">
<title id="title">安全约束与证据链</title><desc id="desc">危险识别连接约束、可行停车行动和执行；监测检查延迟误差与制动能力，所有步骤需要验证证据。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#475569"/></marker></defs>
<rect width="440" height="490" rx="12" fill="#f8fafc"/>
<g fill="#e0f2fe" stroke="#0369a1" stroke-width="2"><rect x="15" y="30" width="185" height="90" rx="8"/><rect x="240" y="30" width="185" height="90" rx="8"/><rect x="15" y="195" width="185" height="90" rx="8"/><rect x="240" y="195" width="185" height="90" rx="8"/></g>
<g font-family="sans-serif" font-size="20" fill="#172033" text-anchor="middle"><text x="108" y="66">危险识别</text><text x="108" y="99" font-size="17">保护谁、避免什么</text><text x="332" y="66">安全约束</text><text x="332" y="99" font-size="17">不得越过隔离线</text><text x="108" y="231">可行行动</text><text x="108" y="264" font-size="17">现在还能刹住吗</text><text x="332" y="231">执行与反馈</text><text x="332" y="264" font-size="17">指令是否落实</text></g>
<g stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"><path d="M200 75H235"/><path d="M332 120V155H108V189"/><path d="M200 240H235"/><path d="M200 350V318H108V290"/><path d="M332 285V393H318"/></g>
<rect x="100" y="350" width="215" height="85" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
<g font-family="sans-serif" fill="#172033" text-anchor="middle"><text x="208" y="379" font-size="19">监测前提并处理退化</text><text x="208" y="404" font-size="17">误差界 · 总延迟</text><text x="208" y="427" font-size="17">制动能力</text><text x="220" y="470" font-size="16">每一步都需证据；图示本身不是安全证明</text></g>
