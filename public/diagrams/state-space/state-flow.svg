<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-labelledby="t d"><title id="t">状态与输出的联系</title><desc id="d">当前状态和输入决定状态变化率；积分后得到状态。状态经C与输入经D的贡献相加形成输出。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#334155"/></marker></defs><rect width="800" height="270" rx="12" fill="white"/><g font-family="system-ui,Microsoft YaHei,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a"><text x="400" y="30">先计算状态怎样变，再决定测量什么</text><g fill="#eff6ff" stroke="#2563eb" stroke-width="2"><rect x="170" y="75" width="140" height="60" rx="8"/><rect x="400" y="75" width="130" height="60" rx="8"/><rect x="620" y="75" width="130" height="60" rx="8"/></g><text x="50" y="113">输入 u</text><text x="240" y="111">Ax + Bu</text><text x="465" y="111">积分</text><text x="685" y="111">Cx + Du</text><text x="355" y="85">变化率 ẋ</text><text x="570" y="85">状态 x</text><text x="685" y="198">输出 y</text><text x="405" y="222" font-size="17">初值 x(0) 决定积分从哪里开始</text><g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#a)"><path d="M90 105H170"/><path d="M310 105H400"/><path d="M530 105H620"/><path d="M685 135V173"/><path d="M570 105V175H240V135"/><path d="M120 105V52H685V75"/></g><circle cx="570" cy="105" r="4" fill="#334155"/><circle cx="120" cy="105" r="4" fill="#334155"/></g></svg>