<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" aria-labelledby="title desc"><title id="title">弹簧阻尼小车释放</title><desc id="desc">固定端通过弹簧和阻尼器并联连接小车；向右位移为正，释放后不再施加外力。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker></defs><rect width="680" height="250" rx="12" fill="#f8fafc"/><g fill="none" stroke="#334155" stroke-width="3"><path d="M60 40V200M60 85H105l10 -12 16 24 16 -24 16 24 16 -12h40M219 85H340M60 155H140M140 140V170M140 140H200M140 170H200M170 155H340M340 85V155"/><rect x="340" y="65" width="170" height="110" rx="8"/><circle cx="375" cy="190" r="12"/><circle cx="475" cy="190" r="12"/><path d="M50 207H600M365 35H465" marker-end="url(#arrow)"/></g><g font-family="sans-serif" font-size="20" fill="#0f172a"><text x="385" y="125">小车 m</text><text x="120" y="56">弹簧 k</text><text x="100" y="197">阻尼 c</text><text x="370" y="25">q 正向</text><text x="530" y="110">释放后</text><text x="530" y="143">外力为零</text><text x="180" y="237">速度可暂时增大，机械能的变化取决于阻尼</text></g></svg>