<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
<title id="title">单轨模型的参考点和车体坐标</title><desc id="desc">后轴中心R、质心G、前轴中心F沿车体纵轴排列，距离分别为b与a；车体x向前，y向左；前轮左转角delta为正，前后轴侧向力向左，横摆逆时针为正。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#334155"/></marker></defs>
<rect width="920" height="420" rx="12" fill="#f8fafc"/><rect x="175" y="120" width="540" height="120" rx="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<path d="M140 180H815M445 300V45" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><path d="M445 180H800" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
<path d="M265 180V65M645 180V65" stroke="#b45309" stroke-width="3" marker-end="url(#arr)"/>
<rect x="225" y="169" width="80" height="22" rx="3" fill="#334155"/><rect x="605" y="169" width="80" height="22" rx="3" fill="#334155" transform="rotate(-22 645 180)"/>
<circle cx="445" cy="180" r="7" fill="#e11d48"/><path d="M495 180A50 50 0 0 0 445 130" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr)"/>
<path d="M265 280H445H645M265 270V290M445 270V290M645 270V290" stroke="#64748b" stroke-width="2"/>
<g font-family="sans-serif" font-size="21" fill="#0f172a"><text x="250" y="220">R 后轴</text><text x="425" y="220">G 质心</text><text x="625" y="220">F 前轴</text><text x="800" y="165">x_b 向前</text><text x="460" y="50">y_b 向左</text><text x="280" y="70">F_yr</text><text x="660" y="70">F_yf</text><text x="335" y="310">b</text><text x="540" y="310">a</text><text x="685" y="150">δ &gt; 0</text><text x="470" y="110">r：逆时针为正</text><text x="65" y="365">运动学位置取R；横向动力学状态取G。a + b = L，转角为前轮实际偏角。</text></g>
</svg>
