<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">自动驾驶闭环与独立监控</title><desc id="desc">车辆环境经传感、定位与感知预测、规划和控制回到车辆执行；监控接收状态并向指令仲裁发出回退请求。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#334155"/></marker></defs>
<rect width="960" height="440" rx="12" fill="#f8fafc"/>
<g fill="#e0f2fe" stroke="#0284c7" stroke-width="2"><rect x="25" y="90" width="140" height="90" rx="8"/><rect x="205" y="90" width="140" height="90" rx="8"/><rect x="385" y="90" width="160" height="90" rx="8"/><rect x="585" y="90" width="140" height="90" rx="8"/><rect x="765" y="90" width="165" height="90" rx="8"/><rect x="585" y="290" width="175" height="80" rx="8" fill="#fef3c7"/></g>
<g font-family="sans-serif" font-size="19" fill="#0f172a" text-anchor="middle"><text x="95" y="127">车辆与环境</text><text x="95" y="155">真实状态</text><text x="275" y="127">传感与同步</text><text x="275" y="155">带时间戳</text><text x="465" y="127">定位·感知·预测</text><text x="465" y="155">状态及不确定性</text><text x="655" y="127">规划</text><text x="655" y="155">带时间的轨迹</text><text x="847" y="127">控制·仲裁·执行</text><text x="847" y="155">指令与实际响应</text><text x="672" y="323">运行监控</text><text x="672" y="351">模式与回退请求</text><text x="462" y="40">地图、任务与运行范围为上层约束</text></g>
<g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M165 135H205"/><path d="M345 135H385"/><path d="M545 135H585"/><path d="M725 135H765"/><path d="M847 180V225H95V180"/><path d="M465 180V330H585" stroke-dasharray="7 5"/><path d="M760 330H890V180" stroke-dasharray="7 5"/></g>
<g font-family="sans-serif" font-size="17" fill="#334155"><text x="320" y="215">执行改变下一次观测：闭环</text><text x="325" y="310">新鲜度/故障状态</text><text x="775" y="315">仲裁请求</text><text x="35" y="408">实线：主要数据与作用链；虚线：监控示意。部署时还需核查共因故障与执行权限。</text></g>
</svg>
