<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title"><title id="title">用相同实际输入预测，用测量位置修正，再将估计交给控制器</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs><rect width="760" height="330" rx="12" fill="#f8fafc"/><g fill="none" stroke="#475569" stroke-width="2"><rect x="55" y="42" width="120" height="55" rx="5"/><rect x="310" y="42" width="150" height="55" rx="5"/><rect x="285" y="210" width="230" height="75" rx="5"/><path d="M175 69H310" marker-end="url(#a)"/><path d="M460 69H680" marker-end="url(#a)"/><path d="M235 69V185H320V210" marker-end="url(#a)"/><path d="M610 69V185H470V210" marker-end="url(#a)"/><path d="M285 250H115V97" marker-end="url(#a)"/></g><g fill="#1e293b" font-family="sans-serif" font-size="19" text-anchor="middle"><text x="115" y="77">控制器</text><text x="385" y="77">真实小车</text><text x="400" y="240">观测器</text><text x="400" y="268">预测 + L(y−ŷ)修正</text><text x="245" y="55">实际输入u</text><text x="570" y="55">测量位置y</text><text x="195" y="235">状态估计x̂</text><text x="400" y="317">同一实际输入；创新中测量为正、预测为负</text></g></svg>
