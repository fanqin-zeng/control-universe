<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 330" role="img" aria-labelledby="t d"><title id="t">广义对象与控制器的下LFT</title><desc id="d">外部输入w进入P，输出z用于性能；P测量y送K，K返回控制u。负反馈符号已包含在P22等于负G中。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="740" height="330" rx="10" fill="#f1f5f9"/><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M60 115H270"/><path d="M470 115H680"/><path d="M470 180H580V265H445"/><path d="M295 265H175V180H270"/></g><g stroke="#2563eb" fill="#fff" stroke-width="2"><rect x="270" y="70" width="200" height="145" rx="8"/><rect x="295" y="238" width="150" height="55" rx="6"/></g><g fill="#0f172a" font-family="sans-serif" text-anchor="middle"><text x="370" y="120" font-size="26">P(s)</text><text x="370" y="150" font-size="16">对象、权重与符号</text><text x="370" y="179" font-size="16">P22 = −G</text><text x="370" y="273" font-size="23">K(s)</text><text x="120" y="100" font-size="19">w 外部输入</text><text x="593" y="100" font-size="19">z 性能输出</text><text x="548" y="170" font-size="18">y</text><text x="205" y="170" font-size="18">u</text><text x="100" y="250" font-size="16">u = Ky</text></g></svg>