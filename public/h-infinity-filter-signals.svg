<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
<title id="title">对象、测量和观测器残差</title><desc id="desc">过程扰动w通过平方根q驱动状态方程xdot=ax加输入。真实状态x与测量噪声平方根r乘v相加得到y。残差y减估计xhat，经L注入估计状态方程。误差为x减xhat。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="900" height="340" rx="14" fill="#f1f5f9"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" fill="#0f172a" text-anchor="middle">
<rect x="190" y="40" width="220" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="300" y="80">对象：ẋ = ax + √q w</text>
<text x="55" y="80">过程 w</text><text x="470" y="60">真实 x</text>
<circle cx="550" cy="75" r="22" fill="white" stroke="#334155"/><text x="550" y="83">+</text>
<text x="550" y="145">√r v</text><text x="650" y="63">测量 y</text>
<circle cx="760" cy="185" r="23" fill="white" stroke="#334155"/><text x="754" y="182" font-size="15">+</text><text x="766" y="203" font-size="17">−</text>
<rect x="510" y="190" width="180" height="60" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="600" y="228">残差增益 L</text>
<rect x="190" y="190" width="230" height="60" rx="10" fill="#ffedd5" stroke="#c2410c"/><text x="305" y="228">估计状态：ẋ̂ = ax̂ + 注入</text>
<text x="473" y="209">校正</text><text x="480" y="284">估计 x̂</text>
<text x="450" y="322" font-size="18">e = x − x̂ ：ė = (a − L)e + √q w − L√r v</text>
</g>
<g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M98 75 H190"/><path d="M410 75 H528"/><path d="M550 125 V97"/><path d="M572 75 H760 V162"/>
<path d="M737 185 H713 V220 H690"/><path d="M510 220 H420"/>
<path d="M305 250 V285 H760 V208"/>
</g></svg>
