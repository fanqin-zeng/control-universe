<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title"><title id="title">房间与温度计的两状态模型</title><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155"/></marker></defs><rect width="760" height="190" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="17" fill="#0f172a" text-anchor="middle"><rect x="130" y="50" width="190" height="90" rx="10" fill="#dbeafe" stroke="#2563eb"/><rect x="430" y="50" width="190" height="90" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="55" y="99">u[k]</text><text x="225" y="80">室内温差 x₁</text><text x="225" y="111" font-size="14">保留 0.8，加热系数 2</text><text x="525" y="80">温度计温差 x₂</text><text x="525" y="111" font-size="14">自身保留 0.5</text><text x="374" y="77" font-size="14">系数 0.25</text><text x="690" y="99">y[k]=x₂[k]</text><path d="M82 94H124M325 94H423M624 94H642" stroke="#334155" stroke-width="2" marker-end="url(#b)"/><text x="380" y="167" font-size="15">每一步：两个状态都由同一个旧状态向量计算</text></g></svg>
