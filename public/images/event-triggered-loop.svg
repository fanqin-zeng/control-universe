<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img" aria-labelledby="title"><title id="title">周期测量后本地判断误差，有事件才发送给控制器更新保持输入</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#0369a1"/></marker></defs><rect width="800" height="220" rx="10" fill="#f1f5f9"/><g fill="white" stroke="#64748b"><rect x="25" y="65" width="135" height="70" rx="6"/><rect x="205" y="65" width="145" height="70" rx="6"/><rect x="405" y="65" width="155" height="70" rx="6"/><rect x="625" y="65" width="145" height="70" rx="6"/></g><g font-family="sans-serif" font-size="17" text-anchor="middle" fill="#172033"><text x="400" y="30">每次检查都测量，触发后才更新</text><text x="92" y="94">传感器</text><text x="92" y="119">每 h 秒读 x</text><text x="278" y="94">本地事件判据</text><text x="278" y="119">比较 x̂ 与 x</text><text x="482" y="94">发送后令 x̂ = x</text><text x="482" y="119">控制 u = −2x̂</text><text x="697" y="94">保持器与对象</text><text x="697" y="119">x′ = −x + u</text><text x="378" y="56">有事件</text><text x="592" y="56">u</text><text x="380" y="199">没有事件：不发送，原输入继续保持</text></g><g stroke="#0369a1" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M160 100H205M350 100H405M560 100H625"/><path d="M700 135V164H92V135"/></g></svg>
