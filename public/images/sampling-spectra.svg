<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 190" role="img" aria-labelledby="title desc"><title id="title">采样后频谱按采样角频率重复</title><desc id="desc">在负采样角频率、零和正采样角频率处出现相同谱形，严格带限且复制谱互不重叠时，中心谱可用理想低通分离。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker></defs><rect width="700" height="190" rx="10" fill="#f8fafc"/><path d="M25 130H675" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><g stroke="#2563eb" stroke-width="3" fill="#dbeafe"><path d="M60 130L140 45L220 130Z"/><path d="M270 130L350 45L430 130Z"/><path d="M480 130L560 45L640 130Z"/></g><g fill="#1e293b" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="140" y="158">−ωₛ</text><text x="350" y="158">0</text><text x="560" y="158">ωₛ</text><text x="350" y="25">每一份都带有 1/Tₛ 系数</text><text x="675" y="157">ω</text></g></svg>
