<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" role="img" aria-labelledby="title desc">
<title id="title">连续对象与数字更新</title><desc id="desc">连续状态经采样得到xk，数字控制器产生负反馈uk，零阶保持将uk保持为连续输入u(t)，再作用于连续对象。参考状态为零。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="780" height="260" fill="#f8fafc" rx="12"/>
<g font-family="sans-serif" font-size="19" fill="#172033" text-anchor="middle">
<text x="390" y="30">对象连续运动；控制器每隔 T 秒更新一次</text>
<g fill="#e0f2fe" stroke="#64748b" stroke-width="1.5"><rect x="45" y="75" width="135" height="60" rx="6"/><rect x="230" y="75" width="135" height="60" rx="6"/><rect x="415" y="75" width="135" height="60" rx="6"/><rect x="600" y="75" width="135" height="60" rx="6"/></g>
<text x="112" y="110">连续对象</text><text x="297" y="110">采样器</text><text x="482" y="100">数字控制器</text><text x="482" y="124">uₖ = −Kxₖ</text><text x="667" y="100">零阶保持</text><text x="667" y="124">一段内恒定</text>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"><path d="M180 105H225"/><path d="M365 105H410"/><path d="M550 105H595"/><path d="M667 135V205H112V140"/></g>
<text x="202" y="64">x(t)</text><text x="389" y="64">xₖ</text><text x="574" y="64">uₖ</text><text x="390" y="236">保持后的输入 u(t) 反馈作用于对象</text>
</g></svg>
