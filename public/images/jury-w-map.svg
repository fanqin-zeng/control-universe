<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-labelledby="title desc">
<title id="title">单位圆与w左半平面</title><desc id="desc">z等于零映到w等于负一，z等于一不在有限映射中；圆内对应左半平面。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="820" height="260" fill="#f8fafc" rx="12"/>
<circle cx="160" cy="125" r="82" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<path d="M45 125H265M160 230V20" stroke="#334155" marker-end="url(#arrow)"/>
<circle cx="160" cy="125" r="4" fill="#1d4ed8"/><circle cx="242" cy="125" r="5" fill="white" stroke="#b91c1c" stroke-width="2"/>
<text x="167" y="145" fill="#172033" font-size="16">0</text><text x="246" y="148" fill="#b91c1c" font-size="16">1</text>
<text x="90" y="48" fill="#172033" font-size="18">z 平面</text><text x="95" y="245" fill="#172033" font-size="16">圆内：|z| &lt; 1</text>
<path d="M305 112H470" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="298" y="92" fill="#172033" font-size="17">w = (z+1)/(z−1)</text><text x="305" y="150" fill="#b91c1c" font-size="15">z=1 单独检查</text>
<rect x="510" y="30" width="120" height="180" fill="#dcfce7"/>
<path d="M500 125H780M630 225V20" stroke="#334155" marker-end="url(#arrow)"/>
<circle cx="570" cy="125" r="4" fill="#1d4ed8"/><text x="551" y="149" fill="#172033" font-size="16">−1</text>
<text x="660" y="48" fill="#172033" font-size="18">w 平面</text><text x="520" y="245" fill="#172033" font-size="16">左半平面：Re(w) &lt; 0</text>
</svg>
