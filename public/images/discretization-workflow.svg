<svg xmlns="http://www.w3.org/2000/svg" width="840" height="270" viewBox="0 0 840 270" role="img" aria-labelledby="title desc">
<title id="title">离散更新与反馈模型</title><desc id="desc">连续控制器按指定方法离散化，对象按保持输入建模，二者组成数字闭环后重新验证。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0L9 3.5L0 7" fill="#334155"/></marker></defs>
<rect width="840" height="270" rx="12" fill="#f8fafc"/>
<g fill="#fff" stroke="#64748b" stroke-width="1.5"><rect x="20" y="30" width="170" height="65" rx="8"/><rect x="295" y="30" width="175" height="65" rx="8"/><rect x="20" y="160" width="170" height="65" rx="8"/><rect x="295" y="160" width="175" height="65" rx="8"/><rect x="580" y="90" width="230" height="90" rx="8"/></g>
<g fill="#172033" font-size="18" text-anchor="middle"><text x="105" y="58">连续控制器 C(s)</text><text x="105" y="82">积分 / 滤波微分</text><text x="383" y="58">数字控制器 C(z)</text><text x="383" y="82">逐拍递推与状态</text><text x="105" y="190">连续对象 G(s)</text><text x="105" y="213">明确输入与单位</text><text x="383" y="190">数字对象 G(z)</text><text x="383" y="213">保持输入的采样模型</text><text x="695" y="123">组成实际数字闭环</text><text x="695" y="152">求根 / 频响 / 约束</text></g>
<g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M190 62H295"/><path d="M190 192H295"/><path d="M470 62H530V115H580"/><path d="M470 192H530V155H580"/></g>
<g fill="#334155" font-size="14" text-anchor="middle"><text x="243" y="49">指定方法</text><text x="243" y="178">ZOH等效</text><text x="420" y="253">方法、采样周期、初值与延迟都属于模型</text></g>
</svg>
