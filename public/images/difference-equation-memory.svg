<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 210" role="img" aria-labelledby="memory-title"><title id="memory-title">二阶差分方程的两项记忆</title><defs><marker id="memory-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155"/></marker></defs><rect width="740" height="210" rx="12" fill="#f8fafc"/><g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a"><text x="175" y="30">当前保留的两项</text><text x="560" y="30">下一步保留的两项</text><rect x="45" y="60" width="120" height="65" rx="8" fill="#dbeafe" stroke="#2563eb"/><rect x="185" y="60" width="120" height="65" rx="8" fill="#dbeafe" stroke="#2563eb"/><rect x="430" y="60" width="120" height="65" rx="8" fill="#dcfce7" stroke="#15803d"/><rect x="570" y="60" width="120" height="65" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="105" y="100">y[k]</text><text x="245" y="100">y[k+1]</text><text x="490" y="100">y[k+1]</text><text x="630" y="100">y[k+2]</text><path d="M315 92H417" stroke="#334155" stroke-width="2" marker-end="url(#memory-arrow)"/><text x="367" y="62" font-size="15">计算并移位</text><text x="370" y="165" font-size="16">先用旧的两项和 u[k] 算出新值，再一起更新记忆</text><text x="370" y="190" font-size="14">初值 y[0]、y[1] 提供开始计算所需的信息</text></g></svg>
