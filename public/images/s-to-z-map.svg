<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="mapping-title"><title id="mapping-title">连续指数模态到离散模态的映射</title><defs><marker id="mapping-arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155"/></marker></defs><rect width="760" height="230" fill="#f8fafc" rx="12"/><path d="M55 115H285M170 205V35M450 115H710M580 205V35M315 115H410" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#mapping-arrow)"/><path d="M55 40H170V195H55" fill="#dcfce7" opacity=".6"/><circle cx="580" cy="115" r="68" fill="#dcfce7" stroke="#15803d"/><circle cx="120" cy="85" r="6" fill="#2563eb"/><circle cx="620" cy="85" r="6" fill="#2563eb"/><g font-family="sans-serif" text-anchor="middle" fill="#0f172a" font-size="16"><text x="170" y="22">s 平面</text><text x="580" y="22">z 平面</text><text x="365" y="88">z = exp(sTₛ)</text><text x="108" y="177">σ 小于 0</text><text x="580" y="156">半径小于 1</text><text x="265" y="139">Re(s)</text><text x="198" y="47">Im(s)</text><text x="707" y="139">Re(z)</text><text x="609" y="47">Im(z)</text><text x="365" y="218">半径由衰减率决定，转角由角频率与采样间隔共同决定</text></g></svg>
