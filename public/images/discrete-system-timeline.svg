<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="title"><title id="title">采样与输入的时间顺序</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#334155"/></marker></defs><rect width="720" height="170" fill="#f8fafc" rx="12"/><g font-family="sans-serif" font-size="18" fill="#0f172a" text-anchor="middle"><path d="M50 108H680" stroke="#334155" stroke-width="2" marker-end="url(#a)"/><path d="M100 95V120M360 95V120M620 95V120" stroke="#334155" stroke-width="2"/><text x="100" y="144">k=0，读 x[0]</text><text x="360" y="144">k=1，读 x[1]</text><text x="620" y="144">k=2，读 x[2]</text><text x="230" y="47">这一分钟使用 u[0]</text><text x="490" y="47">下一分钟使用 u[1]</text><path d="M120 68H337M380 68H597" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="360" y="23" font-size="14">每到一个采样时刻先读当前状态，再计算下一状态</text></g></svg>
