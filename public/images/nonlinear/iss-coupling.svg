<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="title desc"><title id="title">互联系统的两条影响路径</title><desc id="desc">x系统和z系统各自衰减，但通过增益g互相影响；外扰d1进入x系统，d2进入z系统。回到原系统的影响经过两次增益。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="760" height="270" rx="12" fill="#f8fafc"/><g fill="#dbeafe" stroke="#2563eb"><rect x="80" y="90" width="210" height="105" rx="8"/><rect x="470" y="90" width="210" height="105" rx="8"/></g><g stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M290 120H455"/><path d="M470 165H305"/><path d="M185 30V78"/><path d="M575 30V78"/></g><g font-family="sans-serif" fill="#1e293b" text-anchor="middle"><text x="185" y="130" font-size="20">x 系统</text><text x="575" y="130" font-size="20">z 系统</text><text x="185" y="165" font-size="16">自身衰减项 −x</text><text x="575" y="165" font-size="16">自身衰减项 −z</text><text x="380" y="105" font-size="17">x → z：g</text><text x="380" y="195" font-size="17">z → x：g</text><text x="185" y="23" font-size="16">外扰 d₁</text><text x="575" y="23" font-size="16">外扰 d₂</text><text x="380" y="240" font-size="17">同向耦合：绕一圈的幅度增益为 g²</text></g></svg>
