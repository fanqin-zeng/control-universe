<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">恒温器的两种模式</title><desc id="desc">加热开启时温度上升，到21摄氏度关闭；关闭时温度下降，到19摄氏度开启。阈值之间保持当前模式，切换瞬间温度连续。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="760" height="290" rx="12" fill="#f8fafc"/><g stroke="#2563eb" fill="#dbeafe"><rect x="65" y="95" width="230" height="110" rx="12"/><rect x="465" y="95" width="230" height="110" rx="12"/></g><g stroke="#475569" fill="none" stroke-width="3" marker-end="url(#arr)"><path d="M295 120H450"/><path d="M465 180H310"/></g><g font-family="sans-serif" text-anchor="middle" fill="#1e293b"><text x="180" y="136" font-size="23">加热开 q=1</text><text x="180" y="175" font-size="17">温度向 28°C 上升</text><text x="580" y="136" font-size="23">加热关 q=0</text><text x="580" y="175" font-size="17">温度向 18°C 下降</text><text x="380" y="96" font-size="17">到 21°C → 关</text><text x="380" y="216" font-size="17">到 19°C → 开</text><text x="380" y="43" font-size="19">19°C 与 21°C 之间：保持当前模式</text><text x="380" y="266" font-size="17">模式可以瞬间改变，温度 θ 不会因此跳变。</text></g></svg>
