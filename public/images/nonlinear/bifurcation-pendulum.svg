<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="title desc"><title id="title">电机转矩与重力矩竞争</title><desc id="desc">左图画出有电机转矩的偏斜摆，右图画出正弦重力矩上限及不同恒定转矩水平线；超过上限时没有交点。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker></defs><rect width="640" height="260" rx="10" fill="#f8fafc"/><g stroke="#334155" stroke-width="3" fill="none"><path d="M40 45H235"/><path d="M130 48V218" stroke-dasharray="5 5" stroke-width="1"/><path d="M130 48L215 185"/><path d="M160 65Q183 92 163 115" marker-end="url(#arr)"/><path d="M315 220H610M330 230V38" stroke-width="2" marker-end="url(#arr)"/><path d="M330 207Q385 35 444 72Q505 107 562 207" stroke="#2563eb"/><path d="M330 115H585" stroke="#16a34a" stroke-width="2"/><path d="M330 48H585" stroke="#dc2626" stroke-dasharray="7 4" stroke-width="2"/></g><circle cx="215" cy="185" r="17" fill="#2563eb"/><circle cx="130" cy="48" r="6" fill="#334155"/><g font-family="sans-serif" font-size="17" fill="#1e293b"><text x="174" y="63">电机转矩 τ</text><text x="144" y="152">θ</text><text x="70" y="243">偏过角度后能否停住？</text><text x="360" y="91" fill="#2563eb">重力矩 sin θ</text><text x="420" y="139" fill="#15803d">较小 τ：有交点</text><text x="385" y="30" fill="#b91c1c">τ&gt;1：超过重力矩上限</text><text x="590" y="243">θ</text></g></svg>
