<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title desc">
<title id="title">MRAC与STR的反馈和参数更新</title><desc id="desc">MRAC将对象状态减去参考模型状态得到误差并更新控制增益。STR用对象输入输出辨识参数，再重算控制增益。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#334155"/></marker></defs>
<rect width="900" height="410" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" font-size="18" text-anchor="middle" fill="#0f172a"><text x="450" y="30">MRAC：用跟踪误差更新增益</text>
<g fill="#e0f2fe" stroke="#0284c7"><rect x="150" y="70" width="170" height="55" rx="7"/><rect x="435" y="70" width="150" height="55" rx="7"/><rect x="150" y="155" width="170" height="50" rx="7"/><rect x="650" y="155" width="190" height="50" rx="7"/></g>
<text x="235" y="104">可调控制器</text><text x="510" y="104">对象</text><text x="235" y="186">参考模型</text><text x="745" y="186">更新律 → 增益</text>
<text x="65" y="104">参考 r</text><text x="375" y="85">u</text><text x="625" y="85">xₚ</text><text x="385" y="167">xₘ</text><text x="600" y="150">e=xₚ−xₘ</text><circle cx="600" cy="180" r="16" fill="white" stroke="#334155"/><text x="590" y="187">−</text><text x="600" y="176">+</text>
<text x="450" y="260">STR：先辨识对象，再计算增益</text>
<g fill="#dcfce7" stroke="#16a34a"><rect x="150" y="290" width="170" height="50" rx="7"/><rect x="435" y="290" width="150" height="50" rx="7"/><rect x="650" y="290" width="190" height="50" rx="7"/></g>
<text x="235" y="322">可调控制器</text><text x="510" y="322">对象</text><text x="745" y="322">RLS辨识参数</text><text x="65" y="322">参考 r</text><text x="450" y="390">设计公式：估计参数 → 控制增益</text></g>
<g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M105 97H150"/><path d="M320 97H435"/><path d="M585 97H710"/><path d="M625 97V45H235V70"/><path d="M625 97H600V164"/><path d="M125 97V180H150"/><path d="M320 180H584"/><path d="M616 180H650"/><path d="M745 205V225H125V115H150"/><path d="M105 315H150"/><path d="M320 315H435"/><path d="M585 315H650"/><path d="M610 315V355H235V340"/><path d="M375 315V275H745V290"/><path d="M745 340V380H660"/><path d="M250 380H125V330H150"/></g>
</svg>
