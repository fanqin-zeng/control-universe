<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-labelledby="title desc">
<title id="title">小车的能量从哪里来，到哪里去</title><desc id="desc">外力乘速度为输入功率，动能和弹簧势能存储在系统中，阻尼把能量转为热。箭头按功率记账方向绘制，输入功率也可以为负。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs>
<rect width="760" height="230" rx="12" fill="#f8fafc"/>
<g font-family="sans-serif" text-anchor="middle" fill="#1e293b"><rect x="242" y="45" width="276" height="140" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="380" y="82" font-size="20">小车与弹簧</text><text x="380" y="116" font-size="17">动能 + 弹簧势能 H</text><text x="380" y="153" font-size="16">储能变化 = 输入 − 耗散</text>
<text x="117" y="73" font-size="18">外界做功</text><text x="119" y="151" font-size="16">功率 u·v（可正可负）</text>
<text x="637" y="73" font-size="18">阻尼发热</text><text x="637" y="151" font-size="16">耗散功率 b·v² ≥ 0</text>
<text x="380" y="215" font-size="15">输入 u 是力，输出 y=v 是速度；两者相乘才是功率。</text></g>
<g stroke="#475569" stroke-width="3" marker-end="url(#arr)"><path d="M35 110H225"/><path d="M530 110H720"/></g></svg>
