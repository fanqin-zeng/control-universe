<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-labelledby="title desc"><title id="title">弹簧和阻尼消耗能量</title><desc id="desc">拉开质量块时弹簧储能，释放后运动，阻尼把机械能转成热。</desc><rect width="760" height="220" rx="12" fill="#f8fafc"/><g stroke="#334155" stroke-width="3" fill="none"><path d="M40 40v125m0-70h25l10-15 15 30 15-30 15 30 15-30 15 15h45"/><path d="M40 140h70m0-12v24m0-12h85"/><path d="M80 177h255"/><rect x="195" y="70" width="110" height="90" rx="7" fill="#dbeafe"/><path d="M310 115h60m-12-8 12 8-12 8"/></g><g font-family="sans-serif" font-size="18" fill="#0f172a"><text x="223" y="122">质量块</text><text x="67" y="57">弹簧储能</text><text x="66" y="207">阻尼消耗机械能</text><text x="400" y="75">拉得远：势能大</text><text x="400" y="112">动得快：动能大</text><text x="400" y="149">速度为零的一瞬间</text><text x="400" y="180">不等于以后一直静止</text></g></svg>