<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 210" role="img" aria-labelledby="title desc"><title id="title">非线性和线性部分组成的负反馈环</title><desc id="desc">误差e进入非线性f，输出v经G产生y，y负反馈到比较点。只保留基波是近似，不改变真实结构。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#334155"/></marker></defs><rect width="820" height="210" rx="12" fill="#f8fafc"/><g fill="none" stroke="#334155" stroke-width="2.5"><circle cx="100" cy="90" r="20"/><rect x="205" y="55" width="190" height="70" rx="7" fill="#dbeafe"/><rect x="500" y="55" width="180" height="70" rx="7" fill="#dcfce7"/><path d="M30 90h47m43 0h83m192 0h102m183 0h98M740 90v80H100v-57" marker-end="url(#a)"/></g><g font-family="sans-serif" fill="#0f172a" font-size="20"><text x="28" y="75">r=0</text><text x="150" y="75">e</text><text x="430" y="75">v</text><text x="750" y="75">y</text><text x="230" y="98">非线性 f</text><text x="535" y="98">线性 G(s)</text><text x="112" y="146">−</text><text x="225" y="202">e=−y；A是e的基波幅值</text></g></svg>