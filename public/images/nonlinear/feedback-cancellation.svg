<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" aria-label="摆杆重力补偿"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#475569"/></marker></defs><rect width="900" height="210" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#1e293b" text-anchor="middle"><rect x="170" y="45" width="240" height="65" rx="8" fill="#dbeafe" stroke="#475569"/><rect x="480" y="45" width="280" height="65" rx="8" fill="#dcfce7" stroke="#475569"/><text x="70" y="83">加速度 v</text><text x="290" y="83">u=(v−G sin θ)/b</text><text x="620" y="83">摆杆 θ̈=G sin θ+bu</text><text x="830" y="83">角度 θ</text><text x="450" y="188">准确模型、未限幅时，代入得到 θ̈=v</text></g><g fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"><path d="M120 78H170"/><path d="M410 78H480"/><path d="M760 78H790"/><path d="M775 78V140H290V110"/></g><text x="510" y="135" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#475569">测量角度，计算重力补偿</text></svg>