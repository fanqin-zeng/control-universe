<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" role="img" aria-labelledby="title desc"><title id="title">数字控制中的取样、计算与保持</title><desc id="desc">模拟传感信号先经抗混叠滤波，再被ADC采样和量化，经数字控制器计算，零阶保持输出送向对象；箭头表示信号方向。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#334155"/></marker></defs><rect width="780" height="180" rx="10" fill="#f8fafc"/><g fill="#eff6ff" stroke="#94a3b8"><rect x="95" y="45" width="140" height="65" rx="7"/><rect x="280" y="45" width="140" height="65" rx="7"/><rect x="465" y="45" width="120" height="65" rx="7"/><rect x="630" y="45" width="125" height="65" rx="7"/></g><g stroke="#334155" stroke-width="2" marker-end="url(#a)"><path d="M20 77H95"/><path d="M235 77H280"/><path d="M420 77H465"/><path d="M585 77H630"/></g><g font-family="sans-serif" font-size="17" fill="#1e293b" text-anchor="middle"><text x="165" y="73">模拟低通</text><text x="165" y="97">抗混叠</text><text x="350" y="73">ADC</text><text x="350" y="97">采样 + 量化</text><text x="525" y="73">数字控制器</text><text x="525" y="97">按次计算</text><text x="693" y="73">保持输出</text><text x="693" y="97">直到下次更新</text><text x="65" y="139">连续信号</text><text x="430" y="139">一串数值</text><text x="693" y="139">分段恒值</text></g></svg>
