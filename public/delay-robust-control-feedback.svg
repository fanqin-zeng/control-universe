<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">带延迟历史的负反馈</title><desc id="desc">外扰w与负反馈控制u进入一阶对象1除以s加a，输出x。输出经过历史缓冲与纯延迟tau得到x(t减tau)，再通过负增益负k回到对象。正延迟需要整段初始历史phi。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
<rect width="900" height="300" rx="14" fill="#f1f5f9"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">
<text x="85" y="78">外扰 w</text><circle cx="210" cy="72" r="23" fill="white" stroke="#334155"/><text x="210" y="80">+</text>
<rect x="335" y="40" width="210" height="65" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="440" y="80">对象 1 / (s + a)</text>
<text x="690" y="57">状态 x(t)</text>
<rect x="550" y="168" width="250" height="68" rx="10" fill="#ffedd5" stroke="#c2410c"/><text x="675" y="196">历史缓冲 / 纯延迟 τ</text><text x="675" y="223" font-size="16">输出 x(t − τ)</text>
<rect x="240" y="174" width="170" height="58" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="325" y="210">负反馈 −k</text>
<text x="155" y="162">控制 u</text><text x="450" y="278" font-size="18">正时滞需要 φ(θ), −τ ≤ θ ≤ 0；实验统一 φ ≡ 1、w = 0</text>
</g>
<g fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"><path d="M130 72 H187"/><path d="M233 72 H335"/><path d="M545 72 H845"/><path d="M750 72 V168"/><path d="M550 202 H410"/><path d="M240 203 H210 V95"/></g>
</svg>
