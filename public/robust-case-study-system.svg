<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-labelledby="title desc"><title id="title">双质量柔性定位台与证据流程</title><desc id="desc">力作用第一质量；两质量之间弹簧与阻尼并联；第一质量阻尼接地，第二质量位置输出反馈。建模、设计、证书、抽样各有独立证据。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="880" height="270" rx="12" fill="#f8fafc"/><g stroke="#334155" fill="none" stroke-width="2"><path d="M25 105H130" marker-end="url(#a)"/><rect x="140" y="65" width="120" height="100" rx="8"/><rect x="540" y="65" width="120" height="100" rx="8"/><path d="M260 85H300l12 -12 20 24 20 -24 20 24 20 -24 20 24 12 -12H540"/><path d="M260 140H370m0 -14v28h40m0 -28v28m0 -14h130"/><path d="M200 165v20h-70m0 -12v24H85m0 -24v24m0 -12H40m0 -20v40"/><path d="M660 100H800" marker-end="url(#a)"/><path d="M160 238H300" marker-end="url(#a)"/><path d="M440 238H540" marker-end="url(#a)"/><path d="M700 238H785" marker-end="url(#a)"/></g><g font-family="sans-serif" font-size="18" fill="#0f172a"><text x="20" y="88">F = q(r−x₂)</text><text x="178" y="120">m₁ = 1</text><text x="565" y="120">m₂</text><text x="393" y="60">k</text><text x="392" y="180">b = 0.5</text><text x="80" y="218">b₁ = 0.2 接地</text><text x="710" y="85">y = x₂</text><text x="45" y="244">物理建模</text><text x="310" y="244">候选设计</text><text x="550" y="244">严格证书</text><text x="790" y="244">抽样</text></g></svg>
