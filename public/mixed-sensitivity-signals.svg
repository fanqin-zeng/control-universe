<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">混合灵敏度三个加权输出</title><desc id="desc">参考r减去输出q得到误差e，e经过K产生u，u经过G产生q。e、q、u分别经过W1、W2、W3形成z1、z2、z3。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="760" height="290" rx="12" fill="#f8fafc"/><g fill="white" stroke="#334155" stroke-width="2"><circle cx="100" cy="160" r="18"/><rect x="220" y="135" width="90" height="50"/><rect x="410" y="135" width="90" height="50"/><rect x="145" y="40" width="80" height="40"/><rect x="335" y="40" width="80" height="40"/><rect x="570" y="40" width="80" height="40"/></g><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M25 160H80"/><path d="M118 160H220"/><path d="M310 160H410"/><path d="M500 160H710"/><path d="M550 160V250H100V180"/><path d="M150 160V95H170V80"/><path d="M350 160V95H365V80"/><path d="M610 160V80"/><path d="M225 60H270"/><path d="M415 60H460"/><path d="M650 60H710"/></g><g fill="#0f172a" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="43" y="145">r</text><text x="100" y="166">+</text><text x="121" y="205">−</text><text x="180" y="148">e</text><text x="265" y="166">K</text><text x="360" y="149">u</text><text x="455" y="166">G</text><text x="670" y="149">q</text><text x="185" y="66">W₁</text><text x="375" y="66">W₃</text><text x="610" y="66">W₂</text><text x="285" y="66">z₁</text><text x="475" y="66">z₃</text><text x="725" y="66">z₂</text><text x="375" y="278">e = r − q；u = Ke；q = Gu</text></g></svg>
