<svg xmlns="http://www.w3.org/2000/svg" width="780" height="390" viewBox="0 0 780 390" role="img" aria-labelledby="title desc"><title id="title">结构化反馈与性能虚块</title><desc id="desc">上图w经过M产生z，z经过块对角Delta正反馈为w。下图已闭合物理不确定性后的d到e通道，通过分析用满块Delta p将e返回d，构成鲁棒性能检验。</desc><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs><rect width="780" height="390" rx="12" fill="#f8fafc"/><g fill="white" stroke="#334155" stroke-width="2"><rect x="270" y="50" width="200" height="55"/><rect x="270" y="145" width="200" height="55"/><rect x="260" y="250" width="220" height="45"/><rect x="260" y="330" width="220" height="40" stroke-dasharray="7 4"/></g><g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#ar)"><path d="M270 172H155V78H270"/><path d="M470 78H585V172H470"/><path d="M480 273H615V350H480" stroke-dasharray="7 4"/><path d="M260 350H135V273H260" stroke-dasharray="7 4"/></g><g fill="#0f172a" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="370" y="83">M(s)，名义稳定</text><text x="370" y="178">Δ = diag(δ₁,δ₂)</text><text x="195" y="67">w（2维）</text><text x="545" y="67">z（2维）</text><text x="370" y="30">正反馈：z = Mw，w = Δz</text><text x="370" y="237">鲁棒性能：物理Δ另在内部保留</text><text x="370" y="279">HΔ：d → e</text><text x="370" y="356">Δp：e → d（分析用虚块）</text><text x="185" y="266">d</text><text x="555" y="266">e</text><text x="655" y="328">非实际控制器</text></g></svg>
