<svg xmlns="http://www.w3.org/2000/svg" width="920" height="350" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
<title id="title">结构化反馈与D-K更新</title><desc id="desc">广义对象P由外扰v及控制u得到性能e及测量y，控制器K从y回到u；不确定通道由z经过Delta回到w。下部流程固定K分析、拟合D、固定D综合K，然后重新核验。正反馈LFT约定，物理负反馈符号包含在P中。</desc>
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#334155"/></marker></defs>
<rect width="920" height="350" rx="14" fill="#f1f5f9"/>
<g font-family="Arial, Microsoft YaHei, sans-serif" fill="#0f172a" font-size="18" text-anchor="middle">
<rect x="360" y="65" width="180" height="125" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="450" y="112">广义对象 P</text><text x="450" y="145" font-size="15">权重、符号、连接</text>
<rect x="630" y="25" width="160" height="65" rx="10" fill="#ffedd5" stroke="#c2410c"/><text x="710" y="64">结构块 Δ</text>
<rect x="630" y="135" width="160" height="65" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="710" y="174">控制器 K</text>
<text x="95" y="115">外扰 v</text><text x="100" y="160">性能 e</text>
<text x="582" y="45">zδ</text><text x="300" y="40">wδ</text><text x="583" y="155">y</text><text x="302" y="222">u</text>
<text x="450" y="242" font-size="15">正反馈LFT约定；物理负反馈的符号含在P中</text>
<rect x="30" y="270" width="200" height="55" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="130" y="303">固定 K：μ上界分析</text>
<rect x="290" y="270" width="150" height="55" rx="8" fill="#fef3c7" stroke="#a16207"/><text x="365" y="303">拟合可实现 D</text>
<rect x="500" y="270" width="190" height="55" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="595" y="303">固定 D：H∞综合 K</text>
<rect x="750" y="270" width="140" height="55" rx="8" fill="#fee2e2" stroke="#b91c1c"/><text x="820" y="303">重新核验</text>
</g>
<g stroke="#334155" stroke-width="2.4" fill="none" marker-end="url(#arr)">
<path d="M145 108 H360"/><path d="M360 155 H150"/>
<path d="M540 80 H585 V57 H630"/><path d="M790 57 H850 V12 H315 V80 H360"/>
<path d="M540 165 H630"/><path d="M790 166 H850 V218 H315 V173 H360"/>
<path d="M230 297 H290"/><path d="M440 297 H500"/><path d="M690 297 H750"/>
</g></svg>
